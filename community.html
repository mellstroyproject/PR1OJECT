<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17181c"><title>NextProject Community</title><style>
:root{color-scheme:dark;--bg:#1e1f22;--side:#2b2d31;--side2:#232428;--panel:#313338;--line:#3f4147;--text:#f2f3f5;--muted:#aeb2b9;--accent:#5865f2;--green:#23a559}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{height:100dvh;display:grid;grid-template-columns:72px 230px minmax(240px,1fr) 210px;overflow:hidden}.guilds{background:#1e1f22;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}.guild,.add{width:48px;height:48px;border-radius:17px;background:#313338;display:grid;place-items:center;font-weight:800;font-size:20px;transition:.15s}.guild:hover,.guild.active{border-radius:14px;background:var(--accent)}.add{color:#23a559;font-size:28px}.side{background:var(--side);display:flex;flex-direction:column;min-width:0}.sidehead{height:56px;padding:16px;font-weight:800;border-bottom:1px solid #202126;box-shadow:0 1px 3px #0002}.sect{padding:18px 10px 6px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between}.chan{margin:2px 8px;padding:8px 10px;border-radius:5px;color:var(--muted);display:flex;gap:8px;align-items:center;text-align:left;background:transparent}.chan:hover,.chan.active{background:#404249;color:white}.chan span:first-child{font-size:18px}.grow{flex:1}.userbar{background:#232428;padding:10px;display:flex;gap:9px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#454750;display:grid;place-items:center;font-weight:700;flex:none}.uname{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.urole{color:var(--muted);font-size:11px}.tiny{padding:7px;border-radius:6px;background:transparent}.tiny:hover{background:#41434a}.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}.top{height:56px;flex:none;border-bottom:1px solid #25262a;display:flex;align-items:center;padding:0 20px;gap:9px;font-weight:750;box-shadow:0 1px 3px #0001}.top .topic{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}.feed{flex:1;overflow:auto;padding:24px max(18px,4vw) 16px;display:flex;flex-direction:column;gap:20px}.welcome{margin-top:auto;padding:18px 0 24px;border-bottom:1px solid var(--line)}.welcome .big{font-size:30px;font-weight:850}.msg{display:flex;gap:13px;align-items:flex-start}.msg .avatar{width:40px;height:40px}.msgbody{min-width:0;flex:1}.msghead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}.msgname{font-weight:750}.time{color:#949ba4;font-size:11px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.react{background:#25272c;border:1px solid var(--line);padding:2px 7px;border-radius:9px;font-size:12px}.react:hover{border-color:var(--accent)}.composer{margin:0 20px 22px;background:#383a40;border-radius:9px;display:flex;align-items:end;padding:8px;gap:8px}.composer textarea{resize:none;max-height:140px;min-height:40px;flex:1;background:transparent;border:0;outline:0;color:white;padding:10px}.send{background:var(--accent);padding:10px 14px;border-radius:7px;font-weight:700}.right{background:var(--side);padding:18px 10px;overflow:auto}.right h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:5px 8px 12px}.person{display:flex;align-items:center;gap:9px;padding:8px;border-radius:6px;cursor:pointer;color:#dbdee3}.person:hover{background:#404249}.person .avatar{width:32px;height:32px}.dot{width:9px;height:9px;background:#23a559;border:2px solid var(--side);border-radius:50%;margin-left:-17px;margin-top:23px}.hint{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{background:#313338;border-radius:12px;padding:22px;width:min(420px,100%);box-shadow:0 20px 60px #0008}.dialog h2{margin:0 0 15px}.field{width:100%;background:#1e1f22;border:1px solid #44464d;color:white;border-radius:7px;padding:11px;margin:7px 0 12px}.btnrow{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.secondary{background:#454750;padding:10px 14px;border-radius:7px}.empty{margin:auto;text-align:center;color:var(--muted)}.voicebar{display:none;background:#202126;padding:12px;gap:8px;align-items:center;justify-content:space-between}.voicebar.on{display:flex}.mobile-head{display:none}@media(max-width:900px){.app{grid-template-columns:60px 190px minmax(0,1fr)}.right{display:none}.guilds{padding:10px 6px}.guild{width:44px;height:44px}}@media(max-width:600px){.app{grid-template-columns:56px minmax(0,1fr)}.side{display:none}.main{grid-column:2}.top{padding:0 12px}.top .topic{display:none}.feed{padding:16px 12px}.composer{margin:0 10px 12px}.welcome .big{font-size:24px}.msg{gap:9px}.msg .avatar{width:34px;height:34px}}
</style></head><body><div class="app"><aside class="guilds"><a class="guild active" href="/community" title="NextProject">N</a><button class="add" id="addChannel" title="Создать канал" hidden>+</button><div class="grow"></div><button class="guild" id="home" title="На сайт">⌂</button></aside><aside class="side"><div class="sidehead">NextProject <span style="color:#aeb2b9;font-weight:400">Community</span></div><div class="sect">Текстовые каналы <button id="newChannel" class="tiny" hidden>＋</button></div><div id="channels"></div><div class="sect">Личные сообщения <button id="newDm" class="tiny">＋</button></div><div id="dms"></div><div class="grow"></div><div class="userbar"><img id="myAvatar" class="avatar" alt="" hidden><div id="myInitial" class="avatar">?</div><div style="min-width:0;flex:1"><div class="uname" id="myName">Загрузка…</div><div class="urole" id="myRole">Подключение</div></div><button id="logout" class="tiny" title="Выйти">↪</button></div></aside><main class="main"><div class="top"><span id="channelIcon">#</span><span id="channelName">general</span><span class="topic" id="topic">Общий чат NextProject</span><span class="grow"></span><button class="tiny" id="voiceBtn" title="Войти в голосовую комнату">🎙</button><button class="tiny" id="membersBtn" title="Участники">♙</button></div><div class="voicebar" id="voicebar"><span>🎙 Голосовая комната <b id="voiceRoom"></b> <span class="hint" id="voiceStatus"></span></span><button class="secondary" id="leaveVoice">Отключиться</button></div><section class="feed" id="feed"><div class="empty">Загрузка сообщений…</div></section><form class="composer" id="composer"><button type="button" class="tiny" id="emoji" title="Эмодзи">☺</button><textarea id="message" rows="1" maxlength="2000" placeholder="Написать сообщение в #general…"></textarea><button class="send" type="submit">Отправить</button></form></main><aside class="right" id="right"><h3>Участники</h3><div id="people"></div><p class="hint" style="padding:12px 8px">Личные сообщения доступны через кнопку ＋ рядом с разделом.</p></aside></div><div class="modal" id="modal"><form class="dialog" id="dialog"><h2 id="modalTitle">Создать канал</h2><label id="fieldLabel">Название</label><input class="field" id="field" maxlength="32" required><div id="extraWrap"><label>Описание (необязательно)</label><input class="field" id="extra" maxlength="160"></div><div class="btnrow"><button type="button" class="secondary" id="cancel">Отмена</button><button class="send" type="submit">Продолжить</button></div></form></div><audio id="remoteAudio" autoplay></audio><script>
const $=s=>document.querySelector(s);let me=null,moderator=false,channels=[],channel=1,dm='',messages=[],last=0,polling=false,voice=null,voiceRoom='',pcs=new Map(),localStream=null,signalTimer=null;
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok){if(r.status===401){location.href='/auth/steam';throw Error('Войдите через Steam')}throw Error(j.error||'Ошибка запроса')}return j}
function avatarNode(url,name){if(url){const i=document.createElement('img');i.className='avatar';i.src=url;i.alt='';i.onerror=()=>{i.replaceWith(initial(name))};return i}return initial(name)}function initial(n){const d=document.createElement('div');d.className='avatar';d.textContent=(n||'?').slice(0,1).toUpperCase();return d}function safe(t){return String(t||'')}
function openModal(title,label,extra,submit){$('#modalTitle').textContent=title;$('#fieldLabel').textContent=label;$('#field').value='';$('#extra').value='';$('#extraWrap').style.display=extra?'block':'none';$('#modal').classList.add('open');$('#field').focus();modalSubmit=submit}let modalSubmit=null;$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};$('#dialog').onsubmit=async e=>{e.preventDefault();try{await modalSubmit?.($('#field').value.trim(),$('#extra').value.trim());$('#modal').classList.remove('open')}catch(e){alert(e.message)}};
function renderChannels(){const box=$('#channels');box.replaceChildren();channels.forEach(c=>{const b=document.createElement('button');b.className='chan'+(!dm&&c.id===channel?' active':'');b.innerHTML='<span>#</span>';const t=document.createElement('span');t.textContent=c.name;b.append(t);b.onclick=()=>{dm='';channel=c.id;$('#channelName').textContent=c.name;$('#channelIcon').textContent='#';$('#topic').textContent=c.topic||'';$('#message').placeholder='Написать сообщение в #'+c.name+'…';last=0;messages=[];renderChannels();loadMessages(true)};box.append(b)})}
function renderPeople(list){const box=$('#people');box.replaceChildren();list.forEach(p=>{const row=document.createElement('div');row.className='person';row.append(avatarNode(p.avatar,p.name));const dot=document.createElement('i');dot.className='dot';dot.style.background=p.online?'#23a559':'#777';row.append(dot);const t=document.createElement('div');t.style.minWidth='0';const n=document.createElement('div');n.className='uname';n.textContent=p.name;const role=document.createElement('div');role.className='urole';role.textContent=p.role+(p.online?' · в сети':'');t.append(n,role);row.append(t);row.onclick=()=>startDM(p);box.append(row)})}
function renderMessages(){const feed=$('#feed');feed.replaceChildren();if(!messages.length){const w=document.createElement('div');w.className='welcome';const big=document.createElement('div');big.className='big';big.textContent=dm?'Личные сообщения':'Добро пожаловать в #'+($('#channelName').textContent||'general');const sub=document.createElement('div');sub.className='hint';sub.textContent=dm?'Это начало вашей переписки.':'Это начало канала. Поздоровайся с сообществом!';w.append(big,sub);feed.append(w);return}messages.forEach(m=>{const row=document.createElement('article');row.className='msg';row.append(avatarNode(m.avatar,m.name||'Игрок'));const main=document.createElement('div');main.className='msgbody';const head=document.createElement('div');head.className='msghead';const name=document.createElement('span');name.className='msgname';name.textContent=m.name|| (m.sender===me.id?me.name:'Игрок');const time=document.createElement('span');time.className='time';time.textContent=new Date(+m.created_at).toLocaleString();head.append(name,time);main.append(head);const body=document.createElement('div');body.className='body';body.textContent=m.body;main.append(body);const acts=document.createElement('div');acts.className='actions';if(!dm){['👍','❤️','😂','🔥','👀','🎉'].forEach(em=>{const b=document.createElement('button');b.className='react';const r=(m.reactions||[]).find(x=>x.emoji===em);b.textContent=em+(r?' '+r.count:'');b.onclick=async()=>{await api('/api/community/reactions',{method:'POST',body:JSON.stringify({message:m.id,emoji:em})});await loadMessages(false)};acts.append(b)})}if(m.sender===me.id||moderator){const del=document.createElement('button');del.className='react';del.textContent='Удалить';del.onclick=async()=>{if(confirm('Удалить сообщение?')){await api('/api/community/messages/'+m.id,{method:'DELETE'});await loadMessages(false)}};acts.append(del)}main.append(acts);row.append(main);feed.append(row)});feed.scrollTop=feed.scrollHeight}
async function loadMessages(initial=false){if(polling)return;polling=true;try{const url=dm?'/api/community/messages?dm='+encodeURIComponent(dm):'/api/community/messages?channel='+channel;const got=await api(url);if(JSON.stringify(got.map(x=>[x.id,x.body,x.reactions]))!==JSON.stringify(messages.map(x=>[x.id,x.body,x.reactions]))){messages=got;last=got.at(-1)?.id||0;renderMessages()}}catch(e){console.error(e)}finally{polling=false}}
async function loadPeople(){try{renderPeople(await api('/api/community/people'))}catch{}}
async function loadDMs(){try{const list=await api('/api/community/dms'),box=$('#dms');box.replaceChildren();list.forEach(p=>{const b=document.createElement('button');b.className='chan'+(dm===p.peer?' active':'');b.append(avatarNode(p.avatar,p.name||'Игрок'));const t=document.createElement('span');t.textContent=p.name||p.peer;b.append(t);b.onclick=()=>startDM({id:p.peer,name:p.name,avatar:p.avatar});box.append(b)})}catch{}}
function startDM(p){dm=p.id;channel=0;$('#channelName').textContent=p.name||'Личные сообщения';$('#channelIcon').textContent='@';$('#topic').textContent='Личная переписка';$('#message').placeholder='Сообщение для '+(p.name||'пользователя');last=0;messages=[];renderChannels();loadMessages(true)}
$('#newChannel').onclick=$('#addChannel').onclick=()=>openModal('Создать текстовый канал','Название канала',true,async(name,topic)=>{const c=await api('/api/community/channels',{method:'POST',body:JSON.stringify({name,topic})});channels.push(c);renderChannels();$('#channelName').textContent=c.name;channel=c.id;dm='';loadMessages(true)});
$('#newDm').onclick=()=>openModal('Новое личное сообщение','SteamID64 пользователя',false,async(id)=>{if(!/^\d{17}$/.test(id))throw Error('Нужен SteamID64 из 17 цифр');const people=await api('/api/community/people');let p=people.find(x=>x.id===id);if(!p){const name=prompt('Введите имя собеседника (если известно):',id)||id;p={id,name}}startDM(p)});
$('#composer').onsubmit=async e=>{e.preventDefault();const body=$('#message').value.trim();if(!body)return;const payload=dm?{body,dm}:{body,channel};try{await api('/api/community/messages',{method:'POST',body:JSON.stringify(payload)});$('#message').value='';$('#message').style.height='auto';await loadMessages();await loadDMs()}catch(e){alert(e.message)}};$('#message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});$('#message').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'});$('#emoji').onclick=()=>{$('#message').value+=' 😀';$('#message').focus()};$('#home').onclick=()=>location.href='/';$('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});location.href='/'};$('#membersBtn').onclick=()=>{$('#right').style.display=$('#right').style.display==='none'?'block':'none'};
// WebRTC peer-to-peer voice. The application server relays signaling only; STUN is used for NAT traversal.
async function joinVoice(){if(voice)return;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});voiceRoom=prompt('Название голосовой комнаты','Общая')?.trim()||'Общая';voice=true;$('#voicebar').classList.add('on');$('#voiceRoom').textContent='· '+voiceRoom;$('#voiceStatus').textContent='микрофон включён';$('#voiceBtn').textContent='🔊';signalTimer=setInterval(pollSignals,1200);await api('/api/community/voice/presence',{method:'POST',body:JSON.stringify({room:voiceRoom})});setInterval(()=>{if(voice)api('/api/community/voice/presence',{method:'POST',body:JSON.stringify({room:voiceRoom})}).catch(()=>{})},8000);await pollSignals()}catch(e){alert('Не удалось включить микрофон: '+e.message)}}function leaveVoice(){if(voice)api('/api/community/voice/presence?room='+encodeURIComponent(voiceRoom),{method:'DELETE'}).catch(()=>{});voice=false;if(signalTimer)clearInterval(signalTimer);pcs.forEach(pc=>pc.close());pcs.clear();if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;$('#remoteAudio').srcObject=null;$('#voicebar').classList.remove('on');$('#voiceBtn').textContent='🎙'}$('#voiceBtn').onclick=joinVoice;$('#leaveVoice').onclick=leaveVoice;window.addEventListener('beforeunload',()=>{if(localStream)localStream.getTracks().forEach(t=>t.stop())});async function sendSignal(to,payload){return api('/api/community/voice/signal',{method:'POST',body:JSON.stringify({room:voiceRoom,to,payload})})}async function peer(id,offer){let pc=pcs.get(id);if(pc)return pc;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pcs.set(id,pc);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)sendSignal(id,{candidate:e.candidate}).catch(()=>{})};pc.ontrack=e=>{$('#remoteAudio').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){pc.close();pcs.delete(id)}};if(offer){const desc=await pc.createOffer();await pc.setLocalDescription(desc);await sendSignal(id,{description:pc.localDescription})}return pc}async function pollSignals(){if(!voice)return;try{const rows=await api('/api/community/voice/signals?room='+encodeURIComponent(voiceRoom));for(const s of rows){const p=s.payload,pc=await peer(s.sender,false);if(p.description){await pc.setRemoteDescription(p.description);if(p.description.type==='offer'){const a=await pc.createAnswer();await pc.setLocalDescription(a);await sendSignal(s.sender,{description:pc.localDescription})}}else if(p.candidate){try{await pc.addIceCandidate(p.candidate)}catch{}}}const people=await api('/api/community/voice/people?room='+encodeURIComponent(voiceRoom));for(const p of people)if(!pcs.has(p.id)&&me.id<p.id)await peer(p.id,true)}catch(e){console.warn('voice signal',e)}}
(async()=>{try{const result=await api('/api/community/me');me=result.user;moderator=result.moderator;$('#myName').textContent=me.name;$('#myRole').textContent=me.role;$('#myInitial').textContent=(me.name||'?').slice(0,1).toUpperCase();if(me.avatar){$('#myAvatar').src=me.avatar;$('#myAvatar').hidden=false;$('#myInitial').hidden=true}if(moderator){$('#newChannel').hidden=false;$('#addChannel').hidden=false}channels=await api('/api/community/channels');if(!channels.length)throw Error('Нет доступных каналов');channel=channels[0].id;renderChannels();$('#channelName').textContent=channels[0].name;$('#topic').textContent=channels[0].topic||'';await loadMessages(true);await loadPeople();await loadDMs();setInterval(()=>loadMessages(false),2500);setInterval(loadPeople,15000);setInterval(loadDMs,20000)}catch(e){document.querySelector('#feed').textContent=e.message; if(e.message.includes('Steam'))location.href='/auth/steam'}})();
</script></body></html>
