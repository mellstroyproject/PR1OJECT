<style>
:root{color-scheme:dark;--bg:#0f0e17;--panel:#1a1a2a;--panel2:#22223a;--line:#2b2b45;--tx:#f2f2fa;--mut:#8b8ba7;--red:#e5484d;--gold:#f5a524;
 --r:74;--g:108;--b:247;--ar:155;--ag:92;--ab:246;--on-acc:#fff;
 --acc:rgb(var(--r) var(--g) var(--b));--acc-rgb:var(--r),var(--g),var(--b);
 --acc-b:rgb(var(--ar) var(--ag) var(--ab));--acc-b-rgb:var(--ar),var(--ag),var(--ab);
 --acc2:color-mix(in srgb,var(--acc) 45%,#fff);--acc3:color-mix(in srgb,var(--acc) 68%,#fff);--planbg:color-mix(in srgb,var(--acc) 22%,#12121e)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:16px;margin:16px auto;max-width:1280px;padding:10px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800}.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.stat{font-size:12px;color:var(--mut);line-height:1.5}
nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav button{padding:10px 16px;border-radius:12px;font-weight:600}
nav button.on,nav button:hover{background:var(--panel2)}
.tag{background:var(--red);border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px}
.right{display:flex;gap:8px;align-items:center;position:relative}
.promo-wrap{position:relative}
.chip{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.steam{background:var(--acc);border-radius:12px;padding:10px 18px;font-weight:700}
.demo{font-size:12px;color:var(--mut);text-decoration:underline}
.ava{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;border:0}
.promo-btn{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.promo-pop{position:absolute;top:52px;right:0;background:var(--panel2);border-radius:12px;padding:14px;min-width:240px;z-index:6;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;gap:8px}
.promo-pop input{width:100%}
.promo-pop button{background:var(--acc);border-radius:10px;padding:9px 0;font-weight:700}
.promo-msg{font-size:13px;min-height:16px}
.promo-msg.ok{color:#4ade80}.promo-msg.err{color:var(--red)}
.menu{position:absolute;top:52px;right:0;background:var(--panel2);border-radius:12px;padding:8px;min-width:190px;z-index:5;box-shadow:0 8px 24px #0008}
.menu-role{color:var(--gold);font-size:12px;font-weight:700;padding:6px 12px 4px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--line)}
.admin-badge{background:var(--gold);color:#1a1200;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-left:10px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.admin-card{background:var(--panel);border-radius:12px;padding:18px}
.admin-card .n{font-size:26px;font-weight:800}
.admin-card .l{color:var(--mut);font-size:13px;margin-top:4px}
.admin-tools{background:var(--panel);border-radius:12px;padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.admin-tools input{flex:1;min-width:200px}
.admin-tools button{background:var(--panel2);border-radius:10px;padding:10px 16px;font-weight:600}
.admin-tools button.danger{background:var(--red)}
main{max-width:1280px;margin:0 auto 60px;padding:0 16px}
h1{font-size:28px;margin:24px 0 20px}
.cards{display:flex;justify-content:center}
.mode{width:min(100%,320px);height:460px;border-radius:16px;background:linear-gradient(180deg,#1c1c2e,#12121e);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:28px;gap:10px;cursor:pointer;transition:transform .2s}
.mode:hover{transform:translateY(-4px)}
.mode b{font-size:40px;letter-spacing:.5px}
.online{background:var(--panel2);border-radius:20px;padding:4px 14px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:4px 16px}
td{background:var(--panel);padding:14px 16px}
td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
.tabs{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{padding:9px 18px;border-radius:9px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--panel2);color:var(--tx)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
input{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;min-width:240px}
.prem{background:var(--acc);border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-right:8px}
.ban{color:var(--red)}.ok{color:#4ade80}
.plans{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.plan{width:min(100%,360px);border-radius:16px;padding:24px;background:var(--panel);border:1px solid var(--line)}
.plan.p{border-color:var(--acc);background:linear-gradient(180deg,var(--planbg),var(--panel))}
.plan.g{border-color:var(--gold);background:linear-gradient(180deg,#3a2c14,var(--panel))}
.plan h2{font-size:26px;margin-bottom:16px}
.plan li{list-style:none;background:#ffffff0d;border-radius:10px;padding:10px 14px;margin-bottom:8px}
.plan li:before{content:"✓";color:var(--acc);margin-right:10px}
.plan.g li:before{color:var(--gold)}
.periods{display:flex;gap:4px;margin:14px 0}
.periods button{flex:1;padding:8px 0;border-radius:8px;background:#ffffff0d;font-size:13px}
.periods button.on{background:var(--acc)}
.price{font-size:26px;font-weight:800;margin-bottom:12px}
.buy{width:100%;padding:12px;border-radius:12px;background:var(--acc);font-weight:700}
.plan.g .buy{background:var(--gold);color:#1a1200}
.rules{display:grid;grid-template-columns:230px 1fr;gap:16px}
.side{background:var(--panel);border-radius:12px;padding:8px;align-self:start}
.side button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px;color:var(--mut)}
.side button.on{background:var(--panel2);color:var(--tx)}
.empty{background:var(--panel);border-radius:12px;padding:28px;color:var(--mut)}
.join{background:var(--acc);border-radius:10px;padding:8px 16px;font-weight:600}
@media(max-width:760px){.rules{grid-template-columns:1fr}nav{justify-content:flex-start}}

/* ===== анимации ===== */
:root{--ease:cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.14);background:var(--acc)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.6)}70%,100%{box-shadow:0 0 0 9px rgba(var(--acc-rgb),0)}}
@keyframes drift{to{transform:translate3d(5%,4%,0) scale(1.1)}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
 background:radial-gradient(40% 40% at 20% 20%,rgba(var(--acc-rgb),.13),transparent 70%),radial-gradient(35% 35% at 80% 30%,rgba(var(--acc-b-rgb),.11),transparent 70%),radial-gradient(40% 40% at 50% 95%,#f5a52412,transparent 70%);
 animation:drift 26s ease-in-out infinite alternate}
header{animation:drop .8s var(--ease) backwards}
button,.chip,.steam,.join,.promo-btn{transition:background .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease),color .25s,opacity .25s}
button:active{transform:scale(.96)!important}
nav button:hover{transform:translateY(-1px)}
.logo{transition:transform .6s var(--ease)}.logo:hover{transform:rotate(-10deg) scale(1.1)}
.ava{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.ava:hover{transform:scale(1.08);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.4)}
.steam:hover,.promo-btn:hover,.join:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(var(--acc-rgb),.27)}
.promo-btn:hover{background:var(--line)}
.chip.bump{animation:bump .7s var(--ease)}
.price.tick{animation:tick .45s var(--ease)}
input{transition:border-color .25s,box-shadow .25s,background .25s}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
.mode{transition:transform .45s var(--ease),border-color .35s,box-shadow .45s var(--ease)}
.mode:hover{transform:translateY(-8px);border-color:var(--acc);box-shadow:0 24px 60px rgba(var(--acc-rgb),.2)}
.dot{animation:pulse 2s ease-out infinite}
.plan{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.plan:hover{transform:translateY(-6px);box-shadow:0 20px 44px rgba(var(--acc-rgb),.13)}
.plan.g:hover{box-shadow:0 20px 44px #f5a52422}
.plan li{transition:transform .3s var(--ease),background .3s}
.plan li:hover{transform:translateX(5px);background:#ffffff18}
.buy:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(var(--acc-rgb),.33)}
.plan.g .buy:hover{box-shadow:0 10px 26px #f5a52455}
td{transition:background .3s var(--ease)}
tr:hover td{background:var(--panel2)}
.side button{transition:background .3s var(--ease),color .25s,transform .3s var(--ease)}
.side button:hover{transform:translateX(3px);color:var(--tx)}
.menu button:hover{transform:none}
.menu,.menu *{animation:none!important;transition:none!important}
.pop{animation:pop .3s var(--ease);transform-origin:top right}
#app.enter h1{animation:rise .6s var(--ease) backwards}
#app.enter :is(tr,.plan,.mode,.admin-card,.admin-tools,.bar,.side,.empty,.stat,.set-card){animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + 70ms)}
#right.swap>*{animation:rise .55s var(--ease) backwards}
#right.swap>*:nth-child(2){animation-delay:.07s}#right.swap>*:nth-child(3){animation-delay:.14s}#right.swap>*:nth-child(4){animation-delay:.21s}#right.swap>*:nth-child(5){animation-delay:.28s}
@media not all{*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.ava{color:#fff;font-weight:800;font-size:16px}

.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button,.promo-btn,.steam{display:inline-flex;align-items:center;gap:8px}
nav button .ic{opacity:.7;transition:opacity .25s}
nav button.on .ic,nav button:hover .ic{opacity:1}
.promo-btn.gold{color:var(--gold)}
.chip.bal{display:inline-flex;align-items:center;gap:8px;padding:5px 5px 5px 12px}
.chip.bal .ic{color:var(--acc3)}
.plus{width:28px;height:28px;border-radius:8px;background:rgba(var(--acc-rgb),.2);color:var(--acc2);font-weight:700;line-height:1;font-size:16px}
.plus:hover{background:var(--acc);color:#fff}
.menu{min-width:180px;padding:6px}
.menu button{display:flex;align-items:center;gap:10px;color:#cfcfe6;font-size:14px}
.menu button:hover{color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.steam .ic{width:18px;height:18px}

.sec{font-size:20px;margin:30px 0 12px}
select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
.admin-tools button.ok{background:var(--acc)}
.admin-tools .promo-msg{width:100%}
.admin-tools input[type=number]{min-width:150px;flex:0 1 200px}
.lnk{color:var(--acc2);text-decoration:none}.lnk:hover{text-decoration:underline}
.join.del{background:#e5484d33;color:#ff8a8e}.join.del:hover{background:var(--red);color:#fff}

.set-card{background:var(--panel);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;max-width:620px;margin-bottom:16px;flex-wrap:wrap;justify-content:space-between}
.set-card>div:first-child{min-width:0}
.set-ava{width:64px;height:64px;border-radius:16px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;display:grid;place-items:center;font-size:26px;font-weight:800}
.set-card:first-of-type{justify-content:flex-start}
.set-name{font-size:18px;font-weight:700;margin-bottom:4px}
.out-btn{display:inline-flex;align-items:center;gap:8px;background:#e5484d22;color:#ff8a8e;border-radius:12px;padding:12px 20px;font-weight:700}
.out-btn:hover{background:var(--red);color:#fff;transform:translateY(-2px)}

.gear{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--mut)}
.gear .ic{width:18px;height:18px;transition:transform .6s var(--ease)}
.gear:hover,.gear.on{color:#fff;background:var(--line)}
.gear:hover .ic{transform:rotate(90deg)}
.menu{right:48px}
#right.swap>*:nth-child(6){animation-delay:.35s}

@property --r{syntax:'<number>';inherits:true;initial-value:74}
@property --g{syntax:'<number>';inherits:true;initial-value:108}
@property --b{syntax:'<number>';inherits:true;initial-value:247}
@property --ar{syntax:'<number>';inherits:true;initial-value:155}
@property --ag{syntax:'<number>';inherits:true;initial-value:92}
@property --ab{syntax:'<number>';inherits:true;initial-value:246}
@property --on-acc{syntax:'<color>';inherits:true;initial-value:#fff}
:root{transition:--r .7s var(--ease),--g .7s var(--ease),--b .7s var(--ease),--ar .7s var(--ease),--ag .7s var(--ease),--ab .7s var(--ease),--on-acc .7s var(--ease)}

<style>

<style>
/* ===== Анимации ===== */
@keyframes skIn{from{opacity:0;transform:translateY(22px) scale(.92);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes skSlide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes skLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes skPop{0%{opacity:0;transform:scale(.55) rotate(-8deg)}60%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{transform:none}}
@keyframes skPulse{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.75)}100%{box-shadow:0 0 0 24px rgba(var(--acc-rgb),0)}}
@keyframes hexSpin{to{transform:rotate(360deg)}}
@keyframes hexBreath{0%,100%{opacity:.3;transform:scale(.94)}50%{opacity:.7;transform:scale(1.05)}}
@keyframes skShine{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
@keyframes skmFade{from{opacity:0}to{opacity:1}}
@keyframes skmPop{from{opacity:0;transform:translateY(34px) scale(.93)}to{opacity:1;transform:none}}
@keyframes skFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* карточки оружия */
.sk-w,#skModal .sk-card,.pf-tile{position:relative;overflow:hidden;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .22s ease-out,box-shadow .35s var(--ease),border-color .3s}
.sk-w:hover,#skModal .sk-card:hover{--ty:-6px;box-shadow:0 18px 40px -12px rgba(var(--acc-rgb),.7),0 0 0 1px rgba(var(--acc-rgb),.45)}
.sk-w::before,#skModal .sk-card::before,.pf-tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(var(--acc-rgb),.30),transparent 62%)}
.sk-w:hover::before,#skModal .sk-card:hover::before,.pf-tile:hover::before{opacity:1}
.sk-w::after,#skModal .sk-card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;transform:translateX(-130%) skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent)}
.sk-w:hover::after,#skModal .sk-card:hover::after{animation:skShine .9s var(--ease)}
.sk-w img,#skModal .sk-card img{transition:transform .45s var(--ease),filter .45s var(--ease);filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.sk-w:hover img,#skModal .sk-card:hover img{transform:scale(1.1) rotate(-3deg);filter:drop-shadow(0 10px 18px var(--c,#000))}
.sk-w.has img{animation:skFloat 5s ease-in-out infinite}
.sk-w:hover img{animation:none}
.sk-w .hex{animation:hexBreath 3.4s ease-in-out infinite}
.sk-w .hex .h2{transform-origin:32px 32px;animation:hexSpin 9s linear infinite}
.sk-w.has{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--panel)),var(--panel))}
/* появление страницы */
.sk-enter .sk-top{animation:skSlide .5s var(--ease) backwards}
.sk-enter .sk-cat{position:relative;animation:skSlide .5s var(--ease) calc(var(--i,0)*35ms) backwards}
.sk-cat::after{content:"";display:block;height:2px;width:46px;margin-top:6px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc-b));transform-origin:left}
.sk-enter .sk-cat::after{animation:skLine .7s var(--ease) calc(var(--i,0)*35ms + .15s) backwards}
.sk-enter .sk-w{animation:skIn .6s var(--ease) calc(var(--i,0)*38ms) backwards}
.sk-w.pulse{animation:skPulse .85s ease-out}
.sk-w.pulse img{animation:skPop .6s var(--ease)}
/* окно выбора скина */
#skModal{transition:opacity .22s}
#skModal.fresh{animation:skmFade .25s ease-out}
#skModal.fresh .skm{animation:skmPop .45s var(--ease)}
#skModal.fresh .sk-card{animation:skIn .5s var(--ease) calc(var(--i,0)*24ms + .12s) backwards}
#skModal .skm{transition:transform .22s var(--ease)}
#skModal.out{opacity:0;pointer-events:none}
#skModal.out .skm{transform:translateY(18px) scale(.97)}
#skModal .sk-card.just{animation:skPulse .85s ease-out}
#skModal .sk-card.just img{animation:skPop .6s var(--ease)}
#skModal .sk-card.cur{box-shadow:0 0 28px -4px rgba(var(--acc-rgb),.9)}
/* профиль */
.pf-fx .pf-ava{animation:skPop .75s var(--ease) backwards}
.pf-fx .pf-name{animation:skSlide .55s var(--ease) .1s backwards}
.pf-fx .pf-bdg{animation:skPop .6s var(--ease) .35s backwards}
.pf-fx .pf-rank{animation:skIn .6s var(--ease) .2s backwards}
.pf-fx .pf-banbox{animation:skSlide .5s var(--ease) .3s backwards}
.pf-fx .pf-tile{animation:skIn .6s var(--ease) calc(var(--i,0)*50ms + .2s) backwards}
.pf-fx .pf-tabs{animation:skSlide .5s var(--ease) .5s backwards}
.pf-tile:hover{--ty:-4px;box-shadow:0 14px 30px -12px rgba(var(--acc-rgb),.6)}
.pf-bdg.vip{background-size:200% 100%;animation:pfGlow 3s linear infinite}
@keyframes pfGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.0)}50%{box-shadow:0 0 14px 2px rgba(var(--acc-rgb),.65)}}
@media not all{
  .sk-w,.sk-w *,#skModal,#skModal *,.pf-fx *,.pf-bdg{animation:none!important;transition:none!important}
  .sk-w,#skModal .sk-card,.pf-tile{transform:none!important}
}
</style>
<style>

#chatDock.hide{opacity:0;pointer-events:none;transform:translateY(20px)}
#chatDock.nohint .chat-pill{display:none}
.chat-pill{background:rgba(14,16,28,.9);border:1px solid var(--line);color:var(--tx);border-radius:16px;padding:15px 20px;font:inherit;font-weight:700;cursor:pointer;backdrop-filter:blur(10px);transition:transform .3s var(--ease),background .25s}
.chat-pill:hover{transform:translateY(-3px);background:var(--panel2)}
.chat-fab{position:relative;width:52px;height:52px;border-radius:16px;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc-b));box-shadow:0 14px 32px -8px rgba(var(--acc-rgb),.85);transition:transform .3s var(--ease)}
.chat-fab:hover{transform:translateY(-3px) scale(1.06)}
.chat-fab .ic{width:24px;height:24px;fill:currentColor;stroke:none}
.chat-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 12px/20px inherit;font-style:normal;text-align:center;padding:0 5px;transform:scale(0);transition:transform .3s var(--ease)}
.chat-badge.on{transform:scale(1);animation:skPulse 1.6s ease-out infinite}
.chat-panel{position:fixed;top:10px;right:10px;bottom:10px;width:min(380px,calc(100vw - 20px));z-index:155;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:24px;
  background:color-mix(in srgb,var(--acc) 5%,rgba(12,13,24,.96));border:1px solid var(--line);box-shadow:0 30px 80px -20px #000;backdrop-filter:blur(18px);
  transform:translateX(115%);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .3s}
.chat-panel.open{transform:none;opacity:1;pointer-events:auto}
.chat-head{position:relative;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:16px;padding:10px 12px 10px 18px}
.chat-title{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}.chat-title .ic{width:20px;height:20px;fill:currentColor;stroke:none}
.chat-btns{display:flex;gap:8px}.chat-btns button{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel2);color:var(--tx);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:transform .3s var(--ease),background .25s}
.chat-btns button:hover{background:var(--line);transform:rotate(8deg)}.chat-btns .ic{width:18px;height:18px}
.chat-menu{position:absolute;top:62px;right:8px;width:270px;z-index:3;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 16px 40px -10px #000;opacity:0;transform:translateY(-8px) scale(.97);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.chat-menu.on{opacity:1;transform:none;pointer-events:auto}
.chat-menu label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;font-size:14px;cursor:pointer;border-radius:10px}.chat-menu label:hover{background:var(--panel)}
.chat-menu input{position:absolute;opacity:0;pointer-events:none}
.chat-menu i{flex:none;width:38px;height:22px;border-radius:12px;background:var(--panel);border:1px solid var(--line);position:relative;transition:background .25s}
.chat-menu i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:transform .25s var(--ease),background .25s}
.chat-menu input:checked+i{background:linear-gradient(135deg,var(--acc),var(--acc-b));border-color:transparent}.chat-menu input:checked+i:after{transform:translateX(16px);background:#fff}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 2px 0;scroll-behavior:smooth;overscroll-behavior:contain}
.chat-list::-webkit-scrollbar{width:6px}.chat-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.ch-m{display:flex;gap:12px;padding:12px 14px;border-radius:18px;background:var(--panel);border:1px solid transparent}
.ch-m.st{background:linear-gradient(135deg,rgba(244,63,94,.16),rgba(244,63,94,.05));border-color:rgba(244,63,94,.14)}
.ch-m.vp{background:linear-gradient(135deg,rgba(80,110,255,.2),rgba(80,110,255,.06));border-color:rgba(80,110,255,.16)}
.ch-m.new{animation:skIn .45s var(--ease) backwards}
.ch-ava{flex:none;width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;text-decoration:none;transition:transform .3s var(--ease)}
.ch-ava:hover{transform:scale(1.08) rotate(-4deg)}
.ch-b{min-width:0;flex:1}
.ch-t{display:flex;align-items:center;gap:6px}
.ch-n{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-crown{width:15px;height:15px;flex:none}
.ch-t time{margin-left:auto;color:var(--mut);font-size:13px}
.ch-del{opacity:0;background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;padding:0 2px;transition:opacity .2s,color .2s}.ch-m:hover .ch-del{opacity:1}.ch-del:hover{color:var(--red)}
.ch-x{margin-top:5px;font-size:15px;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
.ch-men{color:var(--acc-b);font-weight:600}
.chat-foot{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:18px;padding:10px}
.chat-foot input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;padding:10px 8px}
.ch-send{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc-b));display:grid;place-items:center;transition:transform .3s var(--ease)}
.ch-send:hover{transform:scale(1.1) rotate(-8deg)}.ch-send .ic{width:20px;height:20px}
.ch-login{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:var(--on-acc);cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc-b))}
@media (max-width:700px){.chat-panel{inset:0;width:auto;border-radius:0;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}.chat-pill{display:none}#chatDock{right:14px;bottom:14px}}
</style>

.pf-bdg.role.own{background:linear-gradient(135deg,#f5b53a,#f97316);color:#1a1204;box-shadow:0 0 16px -2px rgba(249,115,22,.7)}
.pf-bdg.role.dep{background:#f43f5e;color:#fff;box-shadow:0 0 16px -2px rgba(244,63,94,.7)}
.pf-bdg.role.plus{background:rgba(245,181,58,.16);color:var(--gold,#f5b53a);border:1px solid rgba(245,181,58,.5)}

<style>
/* ===== Окна подтверждения ===== */
#uiDlg{position:fixed;inset:0;z-index:300;background:rgba(3,6,16,.72);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;transition:opacity .2s}
#uiDlg.fresh{animation:skmFade .2s ease-out}
#uiDlg.out{opacity:0;pointer-events:none}
.dlg{width:min(420px,100%);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 30px 80px -20px #000}
#uiDlg.fresh .dlg{animation:skmPop .4s var(--ease)}
#uiDlg.out .dlg{transform:translateY(14px) scale(.97);transition:transform .2s}
.dlg h3{margin:0 0 10px;font-size:20px}
.dlg p{margin:0 0 6px;color:var(--mut);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.dlg-f{display:block;margin-top:14px;font-weight:700;font-size:14px}
.dlg-f input{display:block;width:100%;box-sizing:border-box;margin-top:8px;background:rgba(0,0,0,.28);border:1px solid transparent;border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:13px 14px;outline:0;transition:border-color .25s,box-shadow .25s}
.dlg-f input:focus{border-color:rgba(var(--acc-rgb),.7);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.18)}
.dlg-b{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.dlg-b button{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,background .25s}
.dlg-c{background:var(--panel);color:var(--tx);border:1px solid var(--line)!important}.dlg-c:hover{background:var(--line)}
.dlg-ok{color:var(--on-acc);background:linear-gradient(135deg,var(--acc),var(--acc-b));box-shadow:0 10px 24px -8px rgba(var(--acc-rgb),.8)}
.dlg-ok.danger{color:#fff;background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 10px 24px -8px rgba(244,63,94,.8)}
.dlg-b button:hover{transform:translateY(-2px)}
@media (max-width:480px){.dlg-b{flex-direction:column-reverse}.dlg-b button{width:100%}}
</style>

<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const reduce=typeof matchMedia==='function'&&MOTION_OFF;
const prev={menu:false,promo:false,logged:false,coins:null,key:''};
function countTo(from,to){
  const t0=performance.now(),d=800;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3),el=$('#bal');
    if(el)el.textContent=(from+(to-from)*e).toFixed(2);
    if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function setPeriod(k,i,btn){
  st.plan[k]=i;
  const plan=btn.closest('.plan');
  plan.querySelectorAll('.periods button').forEach((b,j)=>b.classList.toggle('on',j===i));
  const p=plan.querySelector('.price');
  p.textContent=price[k][i]+' ₽';
  p.classList.remove('tick');void p.offsetWidth;p.classList.add('tick');
}
const st={page:'home',lb:'exp',bt:'bans',plan:{prem:0,plus:0},rule:0,user:null,menu:false,promoOpen:false,promo:'',promoMsg:null};

// Промокоды: временный список для примера, лучше хранить и проверять на сервере,
// иначе любой посмотрит код прямо в исходнике страницы.
const PROMO_CODES={
  'START100':{coins:100,text:'+100 монет'},
  'WELCOME50':{coins:50,text:'+50 монет'},
  'NEXTPROJECT':{coins:200,text:'+200 монет'}
};
const usedPromoKey='usedPromoCodes';
function getUsedPromo(){try{return JSON.parse(localStorage.getItem(usedPromoKey)||'[]')}catch(e){return []}}
function togglePromo(){st.promoOpen=!st.promoOpen;st.menu=false;st.promoMsg=null;draw()}
function buyPlan(key,name){
  if(!st.user){uiAlert('Сначала войдите через Steam, чтобы купить');return}
  const cost=price[key][st.plan[key]];
  const bal=st.user.coins||0;
  if(bal<cost){uiAlert(`Недостаточно средств: не хватает ${(cost-bal).toFixed(2)} ₽. Пополните баланс или используйте промокод.`);return}
  st.user.coins=bal-cost;
  if(key==='plus'){
    const until=Math.max(Date.now(),getPlusUntil(st.user.id))+PERIOD_DAYS[st.plan[key]]*864e5;
    try{localStorage.setItem('plusUntil:'+st.user.id,String(until))}catch(e){}
    applyRole(st.user);
  }
  uiAlert(`Покупка успешна: ${name} ${key==='plus'?'навсегда':'на '+periods[st.plan[key]]}`+(key==='plus'?'. Рядом с промокодом появилась кнопка «Админ-панель».':''));
  draw();
}
function activatePromo(){
  if(!st.user){st.promoMsg={ok:false,text:'Сначала войдите через Steam'};draw();return}
  const code=st.promo.trim().toUpperCase();
  const fail=t=>{st.promoMsg={ok:false,text:t};draw()};
  if(!code)return fail('Введите код');
  const found=allPromos()[code];

function safeAvatar(a){
  return typeof a==='string'&&!a.includes(DEFAULT_AVATAR_HASH)&&/^https:\/\/[\w.-]+\.(steamstatic\.com|akamaihd\.net)\/[\w\-./]+$/i.test(a)?a:null;

function applyRole(u){

const avatarTried={};
async function getWithTimeout(url,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return r}finally{clearTimeout(t)}
}
function parseSteamXml(x){
  const g=tag=>{const m=x.match(new RegExp('<'+tag+'>\\s*(?:<!\\[CDATA\\[)?\\s*([\\s\\S]*?)\\s*(?:\\]\\]>)?\\s*</'+tag+'>'));return m?m[1]:null};
  return {avatar:g('avatarFull'),name:g('steamID')};
}
async function loadSteamAvatar(){
  const u=st.user;
  if(!u||u.avatar||!/^\d{17}$/.test(u.id)||avatarTried[u.id])return;
  avatarTried[u.id]=true;
  let info=null;
  try{
    if(location.protocol.startsWith('http')){info=await (await getWithTimeout('/api/steam-profile?steamid='+u.id,4000)).json()}
  }catch(e){}
  if(!info||!safeAvatar(info.avatar)){
    const xml='https://steamcommunity.com/profiles/'+u.id+'?xml=1';
    const proxies=[x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),x=>'https://corsproxy.io/?'+encodeURIComponent(x)];
    for(const p of proxies){
      try{
        const r=parseSteamXml(await (await getWithTimeout(p(xml),8000)).text());
        if(safeAvatar(r.avatar&&r.avatar.replace(/^http:/,'https:'))){info={avatar:r.avatar.replace(/^http:/,'https:'),name:r.name};break}
      }catch(e){}
    }
  }
  const av=info&&safeAvatar(info.avatar);
  if(av&&st.user&&st.user.id===u.id){
    st.user.avatar=av;
    if(info.name&&typeof info.name==='string')st.user.name=info.name.slice(0,32);
    draw();
  }else avatarTried[u.id]=false; // не вышло — попробуем при следующем входе/загрузке
}

function createPromo(){
  if(!(st.user&&st.user.isOwner))return;
  const code=($('#pCode').value||'').trim().toUpperCase(),coins=+$('#pCoins').value,max=Math.floor(+$('#pMax').value||0);
  if(!/^[A-Z0-9_-]{3,24}$/.test(code))return adminMsgNow('#promoMsgA','Код: 3–24 символа — латиница, цифры, _ или -');
  if(!(coins>0&&coins<=100000))return adminMsgNow('#promoMsgA','Награда: число от 1 до 100 000');
  if(max<0||max>1000000)return adminMsgNow('#promoMsgA','Лимит активаций: от 0 (без лимита) до 1 000 000');

  list.push({code,coins,max,used:0,by:st.user.id,at:Date.now()});LS.set('customPromos',list);

<script>

try{localStorage.removeItem('account')}catch(e){}

async function api(p,b){
  const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Ошибка');
  return j;
}
let SV={grants:{},deputies:{},promos:[]};
function getGrants(){return SV.grants}

function applyRole(u){
  u.avatar=safeAvatar(u.avatar);
  u.isOwner=u.id===OWNER_STEAM_ID;
  u.plusUntil=Math.max(u.plus||0,u.grant||0);
  u.hasPlus=u.plusUntil>Date.now();
  u.isDeputy=!u.isOwner&&!!u.deputy;
  u.canManage=u.isOwner||u.isDeputy;
  u.full=u.isOwner||!!u.full; // владелец и назначенные замы
  u.perms=Array.isArray(u.perms)?u.perms:[];
  u.isAdmin=u.canManage||u.hasPlus||u.perms.length>0;
  u.role=u.isOwner?'Владелец':(u.isDeputy?'Зам':(u.hasPlus?'Админ+':(u.perms.length?'Модератор':null)));
  return u;
}

      rows.forEach(r=>arr.push([r.player,r.admin,r.reason,r.active?1:0,r.term,new Date(r.at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})]));
    }

async function adminAction(verb){
  const t=($('#adminTarget')?.value||'').trim();
  if(!t){uiAlert('Укажите SteamID64 игрока (17 цифр)');return}
  if(verb==='Разбанен'||verb==='Размьючен'){
    if(!/^\d{17}$/.test(t)){uiAlert('Для разбана укажите SteamID64 игрока (17 цифр)');return}
    const fw=await uiForm(verb==='Разбанен'?'Разбанить игрока':'Снять мут',t,[{key:'why',label:'Причина',value:'Разбан с сайта'}],{ok:verb==='Разбанен'?'Разбанить':'Снять мут',danger:false});if(!fw)return;const why=fw.why;
    const isBan=verb==='Разбанен';
    try{
      const r=await api('admin/unban',{target:t,kind:isBan?'bans':'mutes',reason:why});
      await loadBans();
      uiAlert(r.count?((isBan?'Разбанен: ':'Мут снят: ')+t):('У этого игрока нет активных '+(isBan?'банов':'мутов')));
    }catch(e){uiAlert(e.message)}

  }

    await api('admin/punish',{target:t,kind:verb==='Забанен'?'bans':'mutes',reason,days:+d||0});

    uiAlert((verb==='Забанен'?'Бан':'Мут')+' записан: '+t);

}

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(var(--acc-rgb),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--acc-rgb),.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 28%,#000 8%,transparent 74%);mask-image:radial-gradient(ellipse at 50% 28%,#000 8%,transparent 74%)}
.fx,.spot,canvas.stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.fx{overflow:hidden}
.fx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:fxfloat 18s ease-in-out infinite alternate}
.fx i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:rgb(var(--acc-rgb))}
.fx i:nth-child(2){width:38vmax;height:38vmax;right:-10vmax;top:4vh;background:rgb(var(--acc-b-rgb));animation-delay:-6s}
.fx i:nth-child(3){width:34vmax;height:34vmax;left:-8vmax;bottom:-16vmax;background:color-mix(in srgb,var(--acc) 55%,#22d3ee);animation-delay:-11s}
.fx i:nth-child(4){width:40vmax;height:40vmax;right:-14vmax;bottom:-18vmax;background:rgb(var(--acc-b-rgb));animation-delay:-3s}
.fx i:nth-child(5){width:22vmax;height:22vmax;left:38vw;top:32vh;background:rgb(var(--acc-rgb));opacity:.22;animation-duration:24s}
.fx i:nth-child(6){width:14vmax;height:14vmax;left:52vw;top:-6vmax;background:color-mix(in srgb,var(--acc) 40%,#fff);opacity:.30;animation-delay:-9s}
@keyframes fxfloat{to{transform:translate3d(6vmax,5vmax,0) scale(1.15)}}
.spot{opacity:0;transition:opacity .4s;background:radial-gradient(440px circle at var(--mx,50%) var(--my,30%),rgba(var(--acc-rgb),.17),transparent 65%)}
header{backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(var(--acc-rgb),.28);box-shadow:0 8px 42px -10px rgba(var(--acc-rgb),.5),inset 0 1px 0 rgba(255,255,255,.07)}
.plan,.mode,.admin-card,.set-card,.side,.admin-tools,.bar,.empty{backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(var(--acc-rgb),.2);box-shadow:0 10px 40px -14px rgba(var(--acc-rgb),.45),inset 0 1px 0 rgba(255,255,255,.06)}
.plan:hover,.mode:hover,.admin-card:hover{border-color:rgba(var(--acc-rgb),.6);box-shadow:0 18px 54px -10px rgba(var(--acc-rgb),.65),inset 0 1px 0 rgba(255,255,255,.1)}
.menu,.promo-pop{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:color-mix(in srgb,var(--acc) 9%,rgba(8,12,28,.93));border:1px solid rgba(var(--acc-rgb),.3)}
h1{color:#fff;text-shadow:0 0 26px rgba(var(--acc-rgb),.65),0 0 60px rgba(var(--acc-rgb),.3)}
tr:hover td{background:rgba(var(--acc-rgb),.09)}
.steam,.join:not(.del),.plan.p .buy,.periods button.on,.prem{background:linear-gradient(135deg,var(--acc),var(--acc-b));box-shadow:0 6px 24px -4px rgba(var(--acc-rgb),.7)}
.logo{box-shadow:0 0 0 2px rgba(var(--acc-rgb),.65),0 0 26px rgba(var(--acc-rgb),.75)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),.45);border-radius:10px}
@media not all{.fx i{animation:none}}
</style>
<script>
(function(){
  const fx=document.createElement('div');fx.className='fx';fx.innerHTML='<i></i><i></i><i></i><i></i><i></i><i></i>';document.body.prepend(fx);
  const sp=document.createElement('div');sp.className='spot';document.body.prepend(sp);
  let px=0,py=0,pr=0;addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;if(!pr)pr=requestAnimationFrame(()=>{pr=0;sp.style.setProperty('--mx',px+'px');sp.style.setProperty('--my',py+'px');sp.style.opacity=1})},{passive:true});
  if(MOTION_OFF)return;
  const c=document.createElement('canvas');c.className='stars';document.body.prepend(c);
  const x=c.getContext('2d');let W,H,P=[],col='74,108,247';
  const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(70,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.25+.05,t:Math.random()*6.28}))};
  size();addEventListener('resize',size);
  let spr=null,sprCol='',lt=0;
  const mk=()=>{const k=document.createElement('canvas');k.width=k.height=32;const g=k.getContext('2d'),gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba('+col+',1)');gr.addColorStop(.25,'rgba('+col+',.55)');gr.addColorStop(1,'rgba('+col+',0)');g.fillStyle=gr;g.fillRect(0,0,32,32);spr=k;sprCol=col};
  setInterval(()=>{if(!document.hidden)col=getComputedStyle(document.documentElement).getPropertyValue('--acc-rgb').trim()||col},1500);
  (function f(t){requestAnimationFrame(f);if(document.hidden||t-lt<33)return;lt=t;if(!spr||sprCol!==col)mk();
    x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v*2;p.t+=.04;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      x.globalAlpha=.35+.35*Math.sin(p.t);const d=p.r*5;x.drawImage(spr,p.x-d,p.y-d,d*2,d*2)}x.globalAlpha=1})(0);
})();
</script>
<style>
/* ===== Карточка PUBLIC: арт «прицел на закате города» (цвета следуют теме) ===== */
.mode{position:relative;overflow:hidden;isolation:isolate;background:#040814;justify-content:flex-end;padding-bottom:30px}

.mode:hover .mode-go{transform:translateY(-3px)}
@media not all{.mode-art .ring2{animation:none}}

<script>
// ===== Скин-ченджер: страница «Скины» =====
const SKN={data:null,mine:{skins:{},knife:null},open:null,only:false,map:null,k:null,just:null,wear:0.01,seed:0,msg:'',busy:false,q:''};
const skEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
{const n=document.getElementById('nav');if(n){n.innerHTML='';head()}}
const _view=view;
view=function(){return st.page==='skins'?skinsView():_view()};
async function skLoad(){
  if(SKN.busy)return;SKN.busy=true;
  try{SKN.data=await api('skins')}catch(e){SKN.msg=e.message}
  if(SKN.data&&st.user){try{SKN.mine=await api('myskins')}catch(e){SKN.msg=e.message}}
  SKN.busy=false;draw();
}
const SK_ORDER=['Ножи','Автоматические винтовки','Снайперские винтовки','Пистолеты','Пистолеты-пулемёты','Дробовики','Пулемёты'];
const SK_HEX='<svg class="hex" viewBox="0 0 64 64" aria-hidden="true"><path class="h1" d="M32 6l22 13v26L32 58 10 45V19z" fill="none" stroke="currentColor" stroke-width="3"/><path class="h2" d="M32 20l11 6.5v13L32 46l-11-6.5v-13z" fill="none" stroke="currentColor" stroke-width="3"/></svg>';
const skMap=()=>SKN.map||(SKN.map=new Map(SKN.data.skins.map(s=>[s[0]+':'+s[2],s])));
function skCard(w,i){
  const m=SKN.mine.skins[w.def],s=m&&skMap().get(w.id+':'+m.paint),on=w.cat==='Ножи'&&SKN.mine.knife===w.id,hit=SKN.just&&SKN.just.w===w.id;
  return `<div class="sk-w${s?' has':''}${hit?' pulse':''}" style="--c:${s?skEsc(s[4]):'transparent'};--i:${Math.min(i,26)}" onclick="skOpen('${w.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')skOpen('${w.id}')">${s&&/^https:/.test(s[3])?`<img loading="lazy" src="${skEsc(s[3])}" alt="">`:SK_HEX}<span class="wn">${skEsc(w.name)}${on?' · в игре':''}</span><b>${s?skEsc(s[1]):'Стандартный'}</b></div>`;
}
function skinsView(){
  if(!st.user)return '<h1>Скины</h1><div class="empty">Войдите через Steam, чтобы выбрать скины для оружия.</div>';
  if(!SKN.data){
    if(!SKN.busy&&!SKN.msg)skLoad();
    return '<h1>Скины</h1><div class="empty">'+(SKN.msg?skEsc(SKN.msg)+'<br><br><button class="join" onclick="SKN.msg=\'\';draw()">Повторить</button>':'Загружаем скины…')+'</div>';
  }
  const key=st.page+'|'+(PF.id||''),enter=SKN.k!==key;SKN.k=key; // анимация появления — только при открытии, а не при каждом выборе скина
  const D=SKN.data,cats=[...SK_ORDER,...new Set(D.weapons.map(w=>w.cat))].filter((c,i,a)=>a.indexOf(c)===i);
  let n=0;
  const body=cats.map(c=>{
    let ws=D.weapons.filter(w=>w.cat===c);if(SKN.only)ws=ws.filter(w=>SKN.mine.skins[w.def]);
    if(!ws.length)return '';
    const hd=`<h3 class="sk-cat" style="--i:${Math.min(n,26)}">${skEsc(c)}</h3>`;
    return hd+`<div class="sk-cards">${ws.map(w=>skCard(w,n++)).join('')}</div>`;
  }).join('');
  return `<h1>Скины</h1><div class="${enter?'sk-enter':''}">
  <div class="sk-top"><label class="sk-sw"><span>Только выбранные предметы</span><input type="checkbox" ${SKN.only?'checked':''} onchange="SKN.only=this.checked;SKN.k=null;draw()"><i></i></label><span class="sk-hint">Нажмите на оружие, чтобы выбрать скин. В игре напишите !wp, чтобы применить.</span></div>
  ${body||'<div class="empty">Пока ничего не выбрано — выключите «Только выбранные предметы».</div>'}</div>`;
}
function skOpen(id){SKN.open=id;SKN.q='';SKN.msg='';skModal()}
function skClose(){
  SKN.open=null;document.body.style.overflow='';
  const m=document.getElementById('skModal');if(!m)return;
  m.classList.add('out');setTimeout(()=>{if(!SKN.open&&m.parentNode)m.remove()},230);
}
function skModal(){
  if(!SKN.open||!SKN.data){skClose();return}
  const D=SKN.data,cur=D.weapons.find(w=>w.id===SKN.open);if(!cur){skClose();return}
  const my=SKN.mine.skins[cur.def],q=SKN.q.toLowerCase(),list=D.skins.filter(s=>s[0]===cur.id&&/^https:/.test(s[3]));
  let el=document.getElementById('skModal');
  const keep=el&&el.querySelector('.skm-body')?el.querySelector('.skm-body').scrollTop:0;
  if(!el){el=document.createElement('div');el.id='skModal';el.className='fresh';el.onclick=e=>{if(e.target===el)skClose()};document.body.appendChild(el);setTimeout(()=>el.classList.remove('fresh'),1000)}
  el.classList.remove('out');document.body.style.overflow='hidden';
  el.innerHTML=`<div class="skm" role="dialog" aria-modal="true"><div class="skm-head"><b>${skEsc(cur.name)}</b><button class="skm-x" onclick="skClose()" aria-label="Закрыть">✕</button></div>
  <div class="sk-ctl">
    <label>Износ <select onchange="SKN.wear=+this.value">${[['Factory New',0.01],['Minimal Wear',0.10],['Field-Tested',0.25],['Well-Worn',0.40],['Battle-Scarred',0.70]].map(([n,v])=>`<option value="${v}"${SKN.wear===v?' selected':''}>${n}</option>`).join('')}</select></label>
    <label>Seed <input type="number" min="0" max="1000" value="${SKN.seed}" onchange="SKN.seed=+this.value||0"></label>
    <input placeholder="Поиск скина" value="${skEsc(SKN.q)}" oninput="skQ(this.value)">
    ${my?'<button class="join del" onclick="skPick(0)">Сбросить скин</button>':''}
  </div>
  <p class="stat">${skEsc(SKN.msg)}</p>
  <div class="skm-body"><div class="sk-grid">${list.map((s,i)=>{const n=s[1].toLowerCase(),hit=SKN.just&&SKN.just.paint===s[2];return `<div class="sk-card${my&&my.paint===s[2]?' cur':''}${hit?' just':''}" data-n="${skEsc(n)}" style="--c:${skEsc(s[4])};--i:${Math.min(i,16)}${q&&!n.includes(q)?';display:none':''}" onclick="skPick(${s[2]})"><img loading="lazy" src="${skEsc(s[3])}" alt=""><b>${skEsc(s[1])}</b></div>`}).join('')||'<div class="empty">Для этого оружия скинов нет.</div>'}</div></div></div>`;
  const bd=el.querySelector('.skm-body');if(bd)bd.scrollTop=keep;
}
function skQ(v){SKN.q=v;const q=v.toLowerCase();document.querySelectorAll('#skModal .sk-card').forEach(c=>c.style.display=c.dataset.n.includes(q)?'':'none')}
async function skPick(paint){
  const cur=SKN.data.weapons.find(w=>w.id===SKN.open);if(!cur)return;
  try{
    await api('skin',{weapon:cur.id,paint,wear:SKN.wear,seed:SKN.seed});
    if(paint){SKN.mine.skins[cur.def]={paint,wear:SKN.wear,seed:SKN.seed};if(cur.cat==='Ножи')SKN.mine.knife=cur.id}else{delete SKN.mine.skins[cur.def];if(cur.cat==='Ножи'&&SKN.mine.knife===cur.id)SKN.mine.knife=null}
    SKN.msg=paint?'Скин сохранён. В игре напишите !wp, чтобы применить.':'Скин сброшен. В игре напишите !wp.';
    SKN.just={w:cur.id,paint};setTimeout(()=>{SKN.just=null},1000);
  }catch(e){SKN.msg=e.message}
  draw();skModal();
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&SKN.open)skClose()});
// наклон и подсветка карточек за курсором (только на устройствах с мышью)
(function(){
  if(MOTION_OFF)return;
  let el=null,ev=null,raf=0;const rst=e=>{if(e){e.style.setProperty('--rx','0deg');e.style.setProperty('--ry','0deg')}};
  document.addEventListener('pointermove',e=>{
    const c=e.target.closest?e.target.closest('.sk-w,#skModal .sk-card,.pf-tile'):null;
    if(el&&el!==c)rst(el);el=c;if(!c)return;ev=e;
    if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!el)return;
      const r=el.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;
      el.style.setProperty('--ry',((x-.5)*14).toFixed(1)+'deg');el.style.setProperty('--rx',((.5-y)*14).toFixed(1)+'deg');
      el.style.setProperty('--mx',(x*100).toFixed(0)+'%');el.style.setProperty('--my',(y*100).toFixed(0)+'%')});
  },{passive:true});
  document.addEventListener('mouseleave',()=>{rst(el);el=null});
  const lift=e=>{if(e.pointerType&&e.pointerType!=='mouse'){rst(el);el=null}}; // на телефоне карточка выпрямляется, когда палец отпущен
  document.addEventListener('pointerup',lift);document.addEventListener('pointercancel',lift);
})();
// плавный подсчёт чисел в статистике профиля
function pfFx(){
  if(MOTION_OFF)return;
  document.querySelectorAll('.pf-fx .pf-tile b').forEach(b=>{
    if(b.dataset.done)return;b.dataset.done=1;
    const m=b.textContent.match(/^(#?)([\d\s\u00a0.,]+?)(\s*[^\d\s.,].*)?$/);if(!m)return;
    const raw=m[2].replace(/[\s\u00a0]/g,''),num=parseFloat(raw.replace(',','.'));if(!isFinite(num)||num<=0)return;
    const dec=(raw.split(/[.,]/)[1]||'').length,suf=m[3]||'',t0=performance.now(),D=1100;
    const f=t=>{const k=Math.min(1,(t-t0)/D),v=num*(1-Math.pow(1-k,4));b.textContent=m[1]+v.toLocaleString('ru-RU',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(k<1)requestAnimationFrame(f)};
    requestAnimationFrame(f);
  });
}

// ===== Чат сайта =====
const CH={open:false,msgs:[],last:0,unread:0,k:null,timer:0,first:true,sound:false,hint:true,menu:false,canDel:false,seen:0};
try{CH.hasSeen=localStorage.chatSeen!==undefined;CH.sound=localStorage.chatSound==='1';CH.hint=localStorage.chatHint!=='0';CH.seen=+localStorage.chatSeen||0}catch(e){}
const CH_CROWN=c=>`<svg class="ch-crown" viewBox="0 0 24 24" fill="${c}" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z"/><rect x="5" y="19" width="14" height="2" rx="1"/></svg>`;
const CH_ICON='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
function chatBuild(){
  if(document.getElementById('chatDock'))return;
  document.body.insertAdjacentHTML('beforeend',`
  <div id="chatDock"><button class="chat-pill" onclick="chatToggle(true)">Нужна помощь?</button><button class="chat-fab" onclick="chatToggle()" aria-label="Открыть чат">${CH_ICON}<i class="chat-badge" id="chatBadge"></i></button></div>
  <aside id="chatPanel" class="chat-panel" aria-label="Чат">
    <div class="chat-head"><span class="chat-title">${CH_ICON}Чат</span><span class="chat-btns"><button onclick="chatVoice()" title="Войс-чат" aria-label="Войс-чат">🎙</button><button onclick="chatMenu()" aria-label="Настройки чата">${I('gear')}</button><button onclick="chatToggle(false)" aria-label="Закрыть чат">✕</button></span>
      <div class="chat-menu" id="chatMenu"><label><span>Звук новых сообщений</span><input type="checkbox" id="chSound" onchange="chatSet('sound',this.checked)"><i></i></label><label><span>Подсказка «Нужна помощь?»</span><input type="checkbox" id="chHint" onchange="chatSet('hint',this.checked)"><i></i></label></div></div>
    <div class="chat-list" id="chatList"></div>
    <div class="chat-foot" id="chatFoot"></div>
  </aside>`);
  document.getElementById('chSound').checked=CH.sound;document.getElementById('chHint').checked=CH.hint;
  document.getElementById('chatDock').classList.toggle('nohint',!CH.hint);
  chatFoot();
}
function chatSet(k,v){CH[k]=v;try{localStorage['chat'+k[0].toUpperCase()+k.slice(1)]=v?'1':'0'}catch(e){}if(k==='hint')document.getElementById('chatDock').classList.toggle('nohint',!v)}
function chatMenu(){CH.menu=!CH.menu;document.getElementById('chatMenu').classList.toggle('on',CH.menu)}
function chatFoot(){
  const f=document.getElementById('chatFoot');if(!f)return;
  const keep=document.getElementById('chatIn')?document.getElementById('chatIn').value:'';
  f.innerHTML=st.user
    ?`<input id="chatIn" placeholder="Написать..." maxlength="300" autocomplete="off" onkeydown="if(event.key==='Enter')chatSend()"><button class="ch-send" onclick="chatSend()" aria-label="Отправить">${I('tg')}</button>`
    :`<button class="ch-login" onclick="steamLogin()">Войдите через Steam, чтобы писать</button>`;
  const i=document.getElementById('chatIn');if(i)i.value=keep;
}
function chatSync(){ // вошёл/вышел или изменились права — перерисовываем поле ввода и кнопки удаления
  const k=(st.user?st.user.id:'')+'|'+((st.user&&st.user.perms||[]).includes('ban')?1:0);
  if(k===CH.k)return;CH.k=k;CH.canDel=k.endsWith('|1');chatFoot();chatRender(true);
}
function chMsg(m){
  const a=safeAvatar(m.avatar),n=String(m.name||'Игрок'),cls=m.staff?'st':m.vip?'vp':'',d=new Date(m.at);
  const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const text=esc(m.text).replace(/@[^\s,.!?:;]+/g,x=>`<span class="ch-men">${x}</span>`);
  return `<div class="ch-m ${cls}" data-id="${m.id}"><a class="ch-ava" href="/profile/${m.uid}" onclick="chatProfile('${m.uid}');return false" style="${a?`background-image:url('${a}')`:''}">${a?'':esc(n.trim().charAt(0).toUpperCase())}</a>
    <div class="ch-b"><div class="ch-t"><b class="ch-n">${esc(n)}</b>${m.staff?CH_CROWN('#f472b6'):m.vip?CH_CROWN('#6b8cff'):''}<time>${t}</time>${CH.canDel?`<button class="ch-del" onclick="chatDel(${m.id})" title="Удалить сообщение">✕</button>`:''}</div><div class="ch-x">${text}</div></div></div>`;
}
function chatProfile(id){if(innerWidth<700)chatToggle(false);openProfile(id)}
function chatRender(all){
  const list=document.getElementById('chatList');if(!list)return;
  const near=list.scrollHeight-list.scrollTop-list.clientHeight<90;
  if(all){list.innerHTML=CH.msgs.map(chMsg).join('')}
  else{
    const have=new Set([...list.children].map(e=>+e.dataset.id));
    [...list.children].forEach(e=>{if(!CH.msgs.some(m=>m.id===+e.dataset.id))e.remove()});
    CH.msgs.filter(m=>!have.has(m.id)).forEach(m=>{list.insertAdjacentHTML('beforeend',chMsg(m).replace('class="ch-m ','class="ch-m new '))});
  }
  if(near||all||CH.first)list.scrollTop=list.scrollHeight;
}
function chatBeep(){
  try{const C=window.AudioContext||window.webkitAudioContext,c=CH.ac||(CH.ac=new C()),o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.25);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.26)}catch(e){}
}
async function chatPoll(){
  clearTimeout(CH.timer);
  try{
    const r=await api('chat?after='+CH.last);
    const live=new Set(r.live),min=Math.min(...r.live,Infinity);
    const before=CH.msgs.length;
    CH.msgs=r.live.length?CH.msgs.filter(m=>m.id<min||live.has(m.id)):[]; // удалённые модератором исчезают
    const fresh=r.msgs.filter(m=>!CH.msgs.some(x=>x.id===m.id));
    CH.msgs=CH.msgs.concat(fresh).slice(-120);
    if(fresh.length){
      CH.last=Math.max(CH.last,...fresh.map(m=>m.id));
      if(CH.first&&!CH.hasSeen){CH.seen=CH.last;CH.hasSeen=true} // новый посетитель: старая история не считается непрочитанной
      const mine=st.user?st.user.id:null,theirs=fresh.filter(m=>m.uid!==mine);
      if(!CH.open){
        CH.unread+=theirs.filter(m=>m.id>CH.seen).length;
        if(!CH.first&&theirs.length&&CH.sound)chatBeep();
      }else if(theirs.length&&CH.sound&&!CH.first)chatBeep();
    }
    if(fresh.length||CH.msgs.length!==before)chatRender(false);
    CH.first=false;chatBadge();
  }catch(e){}
  CH.timer=setTimeout(chatPoll,document.hidden?30000:CH.open?3500:15000);
}
function chatBadge(){const b=document.getElementById('chatBadge');if(!b)return;b.textContent=CH.unread>9?'9+':CH.unread;b.classList.toggle('on',CH.unread>0)}
function chatToggle(v){
  CH.open=v===undefined?!CH.open:v;
  const p=document.getElementById('chatPanel');p.classList.toggle('open',CH.open);document.getElementById('chatDock').classList.toggle('hide',CH.open&&innerWidth<700);
  if(CH.open){
    CH.unread=0;CH.seen=CH.last;try{localStorage.chatSeen=CH.last}catch(e){}chatBadge();
    const l=document.getElementById('chatList');l.scrollTop=l.scrollHeight;
    const i=document.getElementById('chatIn');if(i&&matchMedia('(hover:hover)').matches)setTimeout(()=>i.focus(),250);
    chatPoll();
  }else{CH.menu=false;document.getElementById('chatMenu').classList.remove('on')}
}
async function chatSend(){
  const i=document.getElementById('chatIn');if(!i)return;const text=i.value.trim();if(!text||CH.busy)return;
  CH.busy=true;
  try{await api('chat',{text});i.value='';CH.first=true;await chatPoll();CH.seen=CH.last;try{localStorage.chatSeen=CH.last}catch(e){}}
  catch(e){toast(e.message,'err')}
  CH.busy=false;if(i&&matchMedia('(hover:hover)').matches)i.focus();
}
async function chatDel(id){try{await api('chat/delete',{id});CH.msgs=CH.msgs.filter(m=>m.id!==id);chatRender(false)}catch(e){toast(e.message,'err')}}
addEventListener('keydown',e=>{if(e.key==='Escape'&&CH.open&&!document.getElementById('promoModal')&&!document.getElementById('skModal'))chatToggle(false)});
chatBuild();chatPoll();

// ===== Красивые окна подтверждения вместо браузерных confirm/alert/prompt =====
let UI_CLOSE=null;
function uiDialog({title='',text='',fields=[],ok='ОК',cancel='Отмена',danger=false}={}){
  return new Promise(res=>{
    if(UI_CLOSE)UI_CLOSE(null);
    const el=document.createElement('div');el.id='uiDlg';el.className='fresh';
    el.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${title?`<h3>${esc(title)}</h3>`:''}${text?`<p>${esc(text).replace(/\n/g,'<br>')}</p>`:''}
      ${fields.map(f=>`<label class="dlg-f">${esc(f.label||'')}<input data-k="${esc(f.key)}" type="${f.type||'text'}" value="${esc(f.value===undefined?'':f.value)}" autocomplete="off"></label>`).join('')}
      <div class="dlg-b">${cancel===false?'':`<button class="dlg-c" type="button">${esc(cancel)}</button>`}<button class="dlg-ok${danger?' danger':''}" type="button">${esc(ok)}</button></div></div>`;
    document.body.appendChild(el);setTimeout(()=>el.classList.remove('fresh'),700);
    let closed=false;
    const done=v=>{if(closed)return;closed=true;UI_CLOSE=null;removeEventListener('keydown',key,true);el.classList.add('out');setTimeout(()=>el.remove(),220);res(v)};
    const submit=()=>{const o={};el.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value);done(fields.length?o:true)};
    const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(null)}else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();submit()}};
    UI_CLOSE=done;addEventListener('keydown',key,true);
    el.onclick=e=>{if(e.target===el&&cancel!==false)done(null)};
    el.querySelector('.dlg-ok').onclick=submit;
    const c=el.querySelector('.dlg-c');if(c)c.onclick=()=>done(null);
    const first=el.querySelector('input');(first||el.querySelector('.dlg-ok')).focus();if(first)first.select();
  });
}
const uiConfirm=(text,o={})=>uiDialog({title:o.title||'Подтвердите действие',text,ok:o.ok||'Подтвердить',danger:o.danger!==false}).then(v=>!!v);
const uiForm=(title,text,fields,o={})=>uiDialog({title,text,fields,ok:o.ok||'Готово',danger:!!o.danger});
const uiAlert=(text,title)=>uiDialog({title:title||'',text:String(text),ok:'Понятно',cancel:false}).then(()=>{});
</script>

<style>
/* ===== Исправление: всплывающее окно промокода пряталось под панелями ===== */
header{position:relative;z-index:30}
/* ===== Красивые уведомления ===== */
.toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;width:min(92vw,370px);pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;padding:14px 16px 17px;border-radius:16px;cursor:pointer;color:#fff;font-weight:600;font-size:14px;line-height:1.4;
  background:color-mix(in srgb,rgb(var(--tc)) 10%,rgba(8,12,28,.92));border:1px solid rgba(var(--tc),.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 50px -12px rgba(var(--tc),.65),inset 0 1px 0 rgba(255,255,255,.07);animation:tin .6s cubic-bezier(.2,1.25,.3,1) both}
.toast.out{animation:tout .35s ease forwards}
.toast .ti{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--tc),.2);color:rgb(var(--tc));box-shadow:0 0 18px rgba(var(--tc),.6)}
.toast .ti svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.toast .ti path{stroke-dasharray:30;stroke-dashoffset:30;animation:tdraw .5s .25s ease forwards}
.toast .tb{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,rgb(var(--tc)),transparent);transform-origin:left;animation:tbar var(--td,4.5s) linear forwards}
.toast:hover .tb{animation-play-state:paused}
.toast.ok{--tc:52,211,153}.toast.err{--tc:248,113,113}.toast.info{--tc:var(--acc-rgb)}
@keyframes tin{from{opacity:0;transform:translateX(70px) scale(.88)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(80px) scale(.9)}}
@keyframes tbar{to{transform:scaleX(0)}}
@keyframes tdraw{to{stroke-dashoffset:0}}
@media(max-width:600px){.toasts{top:auto;bottom:16px;right:50%;transform:translateX(50%)}}
/* ===== Окно ввода вместо системного prompt ===== */
.ask-back{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(2,5,14,.72);backdrop-filter:blur(7px);animation:askfade .25s ease both}

.ask-box{width:min(92vw,400px);padding:24px;border-radius:20px;background:color-mix(in srgb,var(--acc) 9%,#080d1e);border:1px solid rgba(var(--acc-rgb),.4);box-shadow:0 30px 80px -20px rgba(var(--acc-rgb),.6);animation:askpop .4s cubic-bezier(.2,1.2,.3,1) both}
.ask-box h3{margin:0 0 14px;font-size:18px;word-break:break-all}
.ask-box label{display:block;text-align:left;font-size:13px;color:var(--mut);margin-top:10px}
.ask-box input,.ask-box select{display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:#fff;font:inherit}
.ask-box input:focus,.ask-box select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.25)}
.ask-row{display:flex;gap:10px;margin-top:20px}

@keyframes askfade{from{opacity:0}}@keyframes askpop{from{opacity:0;transform:translateY(20px) scale(.92)}}

<script>
// ===== Уведомления (заменяют системные alert) =====
(function(){
  let box;
  const ICON={ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',err:'<path d="M6 6l12 12M18 6L6 18"/>',info:'<path d="M12 7.5h.01M11 11.5h1.2v5.5"/>'};
  const ERR=/^(не |нельзя|ошибк|недостаточно|неверн|нет |укажите|введите|сначала|такого|такой|лимит|этот код|войдите|вашего|для разбана)|не удалось|не найден|не настроен|исчерпан/i;
  const OK=/успешн|применён|сохранён|активирован|выдана|снята|записан|разбанен|создан|удалён|назначен|скопировано|мут снят/i;
  window.toast=function(msg,type){
    msg=String(msg==null?'':msg);type=type||(ERR.test(msg)?'err':OK.test(msg)?'ok':'info');
    if(!box){box=document.createElement('div');box.className='toasts';document.body.appendChild(box)}
    const t=document.createElement('div'),ms=Math.min(9000,3500+msg.length*45);
    t.className='toast '+type;t.style.setProperty('--td',ms+'ms');
    t.innerHTML='<div class="ti"><svg viewBox="0 0 24 24">'+ICON[type]+'</svg></div><div>'+esc(msg)+'</div><i class="tb"></i>';
    const close=()=>{if(t.classList.contains('out'))return;t.classList.add('out');setTimeout(()=>t.remove(),350)};
    let timer=setTimeout(close,ms);
    t.onclick=close;t.onmouseenter=()=>clearTimeout(timer);t.onmouseleave=()=>{timer=setTimeout(close,1500)};
    box.appendChild(t);while(box.children.length>4)box.firstChild.remove();
  };
  window.alert=m=>window.toast(m);
  window.ask=function(title,fields,okText){return new Promise(res=>{
    const o=document.createElement('div');o.className='ask-back';
    o.innerHTML='<div class="ask-box"><h3>'+esc(title)+'</h3>'+fields.map((f,i)=>'<label>'+esc(f.label)+(f.options
      ?'<select data-i="'+i+'">'+f.options.map(([v,t])=>'<option value="'+v+'"'+(v==f.value?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'
      :'<input data-i="'+i+'" type="text" value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'">')+'</label>').join('')
      +'<div class="ask-row"><button class="ask-no">Отмена</button><button class="ask-ok">'+esc(okText||'Подтвердить')+'</button></div></div>';
    document.body.appendChild(o);
    const els=[...o.querySelectorAll('[data-i]')],done=v=>{o.classList.add('out');setTimeout(()=>o.remove(),250);res(v)};
    o.querySelector('.ask-ok').onclick=()=>done(els.map(e=>e.value));
    o.querySelector('.ask-no').onclick=()=>done(null);
    o.onclick=e=>{if(e.target===o)done(null)};
    o.onkeydown=e=>{if(e.key==='Enter')o.querySelector('.ask-ok').click();if(e.key==='Escape')done(null)};
    if(els[0])els[0].focus();
  })};
})();
// ===== Промокоды: окно активации и создание своего промокода =====
const PM={view:'use',code:'',coins:'10',max:'3',msg:null,busy:false};
const PM_TICKET='<svg class="pm-ticket" viewBox="0 0 160 90" aria-hidden="true"><defs><linearGradient id="pmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa8ff"/><stop offset="1" stop-color="#3b4fd8"/></linearGradient></defs><path d="M10 14h140v18a8 8 0 0 0 0 16v28H10V48a8 8 0 0 0 0-16z" fill="url(#pmg)"/><text x="80" y="62" text-anchor="middle" font-size="34" font-weight="900" fill="#1a2a78" letter-spacing="4">XXXX</text></svg>';
function togglePromo(){PM.view='use';PM.msg=null;PM.code=st.promo||'';st.menu=false;promoModal()}
function closePromo(){document.body.style.overflow='';const m=document.getElementById('promoModal');if(!m)return;m.classList.add('out');setTimeout(()=>{if(m.parentNode&&m.classList.contains('out'))m.remove()},230)}
function promoView(v){PM.view=v;PM.msg=null;promoModal()}
function pmCost(){const c=Math.floor(+PM.coins),m=Math.floor(+PM.max);return c>0&&m>0?c*m:0}
function pmProblem(){ // что мешает создать промокод прямо сейчас (null — ничего)
  const c=Math.floor(+PM.coins),m=Math.floor(+PM.max),bal=+(st.user&&st.user.coins)||0;
  if(!/^[\p{L}\p{N}_-]{3,20}$/u.test(PM.code.trim()))return 'Код: 3–20 символов — буквы, цифры, _ или -';
  if(!(c>=10&&c<=10000))return 'Сумма: от 10 до 10 000';
  if(!(m>=3&&m<=1000))return 'Активаций: от 3 до 1000';
  if(pmCost()>bal)return 'Не хватает монет';
  return null;
}
function pmCalc(){ // пересчитываем цену и кнопку без перерисовки окна, чтобы не терялся фокус
  const b=document.getElementById('pmCreate');if(!b)return;
  b.disabled=!!pmProblem();b.firstElementChild.textContent='Создать промокод за '+pmCost().toLocaleString('ru-RU');
}
function promoModal(){
  let el=document.getElementById('promoModal');
  if(!el){el=document.createElement('div');el.id='promoModal';el.className='fresh';el.onclick=e=>{if(e.target===el)closePromo()};document.body.appendChild(el);setTimeout(()=>el.classList.remove('fresh'),900)}
  el.classList.remove('out');document.body.style.overflow='hidden';
  const msg=PM.msg?`<p class="pm-msg ${PM.msg.ok?'ok':'err'}">${esc(PM.msg.text)}</p>`:'<p class="pm-msg"></p>';
  if(PM.view==='create'){
    el.innerHTML=`<div class="pm-wrap"><div class="pm-card" role="dialog" aria-modal="true">
      <div class="pm-head"><h2>СОЗДАТЬ ПРОМОКОД</h2><button class="pm-x" onclick="closePromo()" aria-label="Закрыть">✕</button></div>
      <label class="pm-l">Введите промокод</label><input class="pm-in" id="pmCode" placeholder="XXXXXXXX" maxlength="20" autocomplete="off" value="${esc(PM.code)}" oninput="PM.code=this.value;pmCalc()">
      <label class="pm-l">Сумма промокода (монет за одну активацию)</label><input class="pm-in" type="number" min="10" max="10000" value="${esc(PM.coins)}" oninput="PM.coins=this.value;pmCalc()"><small>От 10 до 10 000 монет</small>
      <label class="pm-l">Кол-во активаций</label><input class="pm-in" type="number" min="3" max="1000" value="${esc(PM.max)}" oninput="PM.max=this.value;pmCalc()"><small>От 3 до 1000 активаций</small>
      ${msg}
      <button class="pm-main" id="pmCreate" onclick="createUserPromo()" ${pmProblem()?'disabled':''}><span>Создать промокод за ${pmCost().toLocaleString('ru-RU')}</span></button>
      <button class="pm-alt in" onclick="promoView('use')">Назад</button></div></div>`;
  }else{
    el.innerHTML=`<div class="pm-wrap">${PM_TICKET}<div class="pm-card" role="dialog" aria-modal="true">
      <div class="pm-head"><h2>ПРОМОКОД</h2><button class="pm-x" onclick="closePromo()" aria-label="Закрыть">✕</button></div>
      <input class="pm-in" id="pmCode" placeholder="XXXXXXXX" maxlength="32" autocomplete="off" value="${esc(PM.code)}" oninput="PM.code=this.value;st.promo=this.value" onkeydown="if(event.key==='Enter')activatePromo()">
      ${msg}
      <button class="pm-main" onclick="activatePromo()">${I('promo')}<span>Активировать промокод</span></button></div>
      <button class="pm-alt" onclick="promoView('create')">+ Создать свой промокод</button></div>`;
  }
  const inp=el.querySelector('#pmCode');if(inp&&matchMedia('(hover:hover)').matches)inp.focus();
}
async function activatePromo(){
  if(!st.user){PM.msg={ok:false,text:'Сначала войдите через Steam'};promoModal();return}
  const code=(PM.code||st.promo||'').trim().toUpperCase();
  if(!code){PM.msg={ok:false,text:'Введите код'};promoModal();return}
  try{const r=await api('promo',{code});st.promo='';PM.code='';closePromo();await loadMe();toast((r.msg||'Код активирован: +'+r.coins+' монет'),'ok')}
  catch(e){PM.msg={ok:false,text:e.message};promoModal()}
}
async function createUserPromo(){
  if(!st.user){PM.msg={ok:false,text:'Сначала войдите через Steam'};promoModal();return}
  const bad=pmProblem();if(bad){PM.msg={ok:false,text:bad};promoModal();return}
  if(PM.busy)return;PM.busy=true;
  try{
    const r=await api('promo/create',{code:PM.code.trim().toUpperCase(),coins:Math.floor(+PM.coins),max:Math.floor(+PM.max)});
    PM.code='';PM.view='use';PM.msg=null;closePromo();await loadMe();toast('Промокод '+r.code+' создан, списано '+r.cost+' монет','ok');
  }catch(e){PM.msg={ok:false,text:e.message};promoModal()}
  PM.busy=false;
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('promoModal'))closePromo()});
async function adminAction(verb){
  const t=($('#adminTarget')?.value||'').trim();
  if(!t){toast('Укажите SteamID64 игрока (17 цифр)');return}
  const unb=verb==='Разбанен'||verb==='Размьючен',pun=verb==='Забанен'||verb==='Замьючен',isBan=verb==='Забанен'||verb==='Разбанен';

      window.NX_GLENT={on:r.on,until:Date.now()+r.left}; // состояние для кнопки «админ абуз» в админ-панели
      if(was!==r.on&&typeof st!=='undefined'&&st.page==='admin'&&typeof draw==='function')draw();
      if(r.on){list=Array.isArray(r.list)?r.list:['/glent.mp3'];start();syncAudio();pollT=setTimeout(poll,Math.min(r.left+300,20000))}else stop();
    }catch(e){}
  }
  window.nxGlentPoll=poll;
  setInterval(()=>{if(!document.hidden)poll()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  poll();
})();
</script>
<style>

.bsb b.r{background:rgba(255,255,255,.2)}
.bsb b.clk{cursor:pointer}.bsb b.clk:hover{outline:2px solid var(--acc,#e5484d);outline-offset:-2px;background:rgba(255,255,255,.14)}
