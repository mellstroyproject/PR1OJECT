<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игровой сервер</title>
<style>
:root{color-scheme:dark;--bg:#0f0e17;--panel:#1a1a2a;--panel2:#22223a;--line:#2b2b45;--tx:#f2f2fa;--mut:#8b8ba7;--red:#e5484d;--gold:#f5a524;
 --r:74;--g:108;--b:247;--ar:155;--ag:92;--ab:246;--on-acc:#fff;
 --acc:rgb(var(--r) var(--g) var(--b));--acc-rgb:var(--r),var(--g),var(--b);
 --acc-b:rgb(var(--ar) var(--ag) var(--ab));--acc-b-rgb:var(--ar),var(--ag),var(--ab);
 --acc2:color-mix(in srgb,var(--acc) 45%,#fff);--acc3:color-mix(in srgb,var(--acc) 68%,#fff);--planbg:color-mix(in srgb,var(--acc) 22%,#12121e)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border-radius:16px;margin:16px auto;max-width:1280px;padding:10px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-weight:800}.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.stat{font-size:12px;color:var(--mut);line-height:1.5}
nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav button{padding:10px 16px;border-radius:12px;font-weight:600}
nav button.on,nav button:hover{background:var(--panel2)}
.tag{background:var(--red);border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px}
.right{display:flex;gap:8px;align-items:center;position:relative}
.promo-wrap{position:relative}
.chip{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.steam{background:var(--acc);border-radius:12px;padding:10px 18px;font-weight:700}
.demo{font-size:12px;color:var(--mut);text-decoration:underline}
.ava{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;border:0}
.promo-btn{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:600}
.promo-pop{position:absolute;top:52px;right:0;background:var(--panel2);border-radius:12px;padding:14px;min-width:240px;z-index:6;box-shadow:0 8px 24px #0008;display:flex;flex-direction:column;gap:8px}
.promo-pop input{width:100%}
.promo-pop button{background:var(--acc);border-radius:10px;padding:9px 0;font-weight:700}
.promo-msg{font-size:13px;min-height:16px}
.promo-msg.ok{color:#4ade80}.promo-msg.err{color:var(--red)}
.menu{position:absolute;top:52px;right:0;background:var(--panel2);border-radius:12px;padding:8px;min-width:190px;z-index:5;box-shadow:0 8px 24px #0008}
.menu-role{color:var(--gold);font-size:12px;font-weight:700;padding:6px 12px 4px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--line)}
.admin-badge{background:var(--gold);color:#1a1200;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-left:10px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.admin-card{background:var(--panel);border-radius:12px;padding:18px}
.admin-card .n{font-size:26px;font-weight:800}
.admin-card .l{color:var(--mut);font-size:13px;margin-top:4px}
.admin-tools{background:var(--panel);border-radius:12px;padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.admin-tools input{flex:1;min-width:200px}
.admin-tools button{background:var(--panel2);border-radius:10px;padding:10px 16px;font-weight:600}
.admin-tools button.danger{background:var(--red)}
main{max-width:1280px;margin:0 auto 60px;padding:0 16px}
h1{font-size:28px;margin:24px 0 20px}
.cards{display:flex;justify-content:center}
.mode{width:min(100%,320px);height:460px;border-radius:16px;background:linear-gradient(180deg,#1c1c2e,#12121e);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:28px;gap:10px;cursor:pointer;transition:transform .2s}
.mode:hover{transform:translateY(-4px)}
.mode b{font-size:40px;letter-spacing:.5px}
.online{background:var(--panel2);border-radius:20px;padding:4px 14px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:4px 16px}
td{background:var(--panel);padding:14px 16px}
td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}
.tabs{display:inline-flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{padding:9px 18px;border-radius:9px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--panel2);color:var(--tx)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
input{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;min-width:240px}
.prem{background:var(--acc);border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-right:8px}
.ban{color:var(--red)}.ok{color:#4ade80}
.plans{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.plan{width:min(100%,360px);border-radius:16px;padding:24px;background:var(--panel);border:1px solid var(--line)}
.plan.p{border-color:var(--acc);background:linear-gradient(180deg,var(--planbg),var(--panel))}
.plan.g{border-color:var(--gold);background:linear-gradient(180deg,#3a2c14,var(--panel))}
.plan h2{font-size:26px;margin-bottom:16px}
.plan li{list-style:none;background:#ffffff0d;border-radius:10px;padding:10px 14px;margin-bottom:8px}
.plan li:before{content:"✓";color:var(--acc);margin-right:10px}
.plan.g li:before{color:var(--gold)}
.periods{display:flex;gap:4px;margin:14px 0}
.periods button{flex:1;padding:8px 0;border-radius:8px;background:#ffffff0d;font-size:13px}
.periods button.on{background:var(--acc)}
.price{font-size:26px;font-weight:800;margin-bottom:12px}
.buy{width:100%;padding:12px;border-radius:12px;background:var(--acc);font-weight:700}
.plan.g .buy{background:var(--gold);color:#1a1200}
.rules{display:grid;grid-template-columns:230px 1fr;gap:16px}
.side{background:var(--panel);border-radius:12px;padding:8px;align-self:start}
.side button{display:block;width:100%;text-align:left;padding:12px;border-radius:8px;color:var(--mut)}
.side button.on{background:var(--panel2);color:var(--tx)}
.empty{background:var(--panel);border-radius:12px;padding:28px;color:var(--mut)}
.join{background:var(--acc);border-radius:10px;padding:8px 16px;font-weight:600}
@media(max-width:760px){.rules{grid-template-columns:1fr}nav{justify-content:flex-start}}

/* ===== анимации ===== */
:root{--ease:cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tick{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.14);background:var(--acc)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--acc-rgb),.6)}70%,100%{box-shadow:0 0 0 9px rgba(var(--acc-rgb),0)}}
@keyframes drift{to{transform:translate3d(5%,4%,0) scale(1.1)}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
 background:radial-gradient(40% 40% at 20% 20%,rgba(var(--acc-rgb),.13),transparent 70%),radial-gradient(35% 35% at 80% 30%,rgba(var(--acc-b-rgb),.11),transparent 70%),radial-gradient(40% 40% at 50% 95%,#f5a52412,transparent 70%);
 animation:drift 26s ease-in-out infinite alternate}
header{animation:drop .8s var(--ease) backwards}
button,.chip,.steam,.join,.promo-btn{transition:background .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease),color .25s,opacity .25s}
button:active{transform:scale(.96)!important}
nav button:hover{transform:translateY(-1px)}
.logo{transition:transform .6s var(--ease)}.logo:hover{transform:rotate(-10deg) scale(1.1)}
.ava{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.ava:hover{transform:scale(1.08);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.4)}
.steam:hover,.promo-btn:hover,.join:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(var(--acc-rgb),.27)}
.promo-btn:hover{background:var(--line)}
.chip.bump{animation:bump .7s var(--ease)}
.price.tick{animation:tick .45s var(--ease)}
input{transition:border-color .25s,box-shadow .25s,background .25s}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
.mode{transition:transform .45s var(--ease),border-color .35s,box-shadow .45s var(--ease)}
.mode:hover{transform:translateY(-8px);border-color:var(--acc);box-shadow:0 24px 60px rgba(var(--acc-rgb),.2)}
.dot{animation:pulse 2s ease-out infinite}
.plan{transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
.plan:hover{transform:translateY(-6px);box-shadow:0 20px 44px rgba(var(--acc-rgb),.13)}
.plan.g:hover{box-shadow:0 20px 44px #f5a52422}
.plan li{transition:transform .3s var(--ease),background .3s}
.plan li:hover{transform:translateX(5px);background:#ffffff18}
.buy:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(var(--acc-rgb),.33)}
.plan.g .buy:hover{box-shadow:0 10px 26px #f5a52455}
td{transition:background .3s var(--ease)}
tr:hover td{background:var(--panel2)}
.side button{transition:background .3s var(--ease),color .25s,transform .3s var(--ease)}
.side button:hover{transform:translateX(3px);color:var(--tx)}
.menu button:hover{transform:translateX(3px)}
.pop{animation:pop .3s var(--ease);transform-origin:top right}
#app.enter h1{animation:rise .6s var(--ease) backwards}
#app.enter :is(tr,.plan,.mode,.admin-card,.admin-tools,.bar,.side,.empty,.stat,.set-card){animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + 70ms)}
#right.swap>*{animation:rise .55s var(--ease) backwards}
#right.swap>*:nth-child(2){animation-delay:.07s}#right.swap>*:nth-child(3){animation-delay:.14s}#right.swap>*:nth-child(4){animation-delay:.21s}#right.swap>*:nth-child(5){animation-delay:.28s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.ava{color:#fff;font-weight:800;font-size:16px}

.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button,.promo-btn,.steam{display:inline-flex;align-items:center;gap:8px}
nav button .ic{opacity:.7;transition:opacity .25s}
nav button.on .ic,nav button:hover .ic{opacity:1}
.promo-btn.gold{color:var(--gold)}
.chip.bal{display:inline-flex;align-items:center;gap:8px;padding:5px 5px 5px 12px}
.chip.bal .ic{color:var(--acc3)}
.plus{width:28px;height:28px;border-radius:8px;background:rgba(var(--acc-rgb),.2);color:var(--acc2);font-weight:700;line-height:1;font-size:16px}
.plus:hover{background:var(--acc);color:#fff}
.menu{min-width:180px;padding:6px}
.menu button{display:flex;align-items:center;gap:10px;color:#cfcfe6;font-size:14px}
.menu button:hover{color:#fff}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.steam .ic{width:18px;height:18px}

.sec{font-size:20px;margin:30px 0 12px}
select{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
.admin-tools button.ok{background:var(--acc)}
.admin-tools .promo-msg{width:100%}
.admin-tools input[type=number]{min-width:150px;flex:0 1 200px}
.lnk{color:var(--acc2);text-decoration:none}.lnk:hover{text-decoration:underline}
.join.del{background:#e5484d33;color:#ff8a8e}.join.del:hover{background:var(--red);color:#fff}

.set-card{background:var(--panel);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;max-width:620px;margin-bottom:16px;flex-wrap:wrap;justify-content:space-between}
.set-card>div:first-child{min-width:0}
.set-ava{width:64px;height:64px;border-radius:16px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;display:grid;place-items:center;font-size:26px;font-weight:800}
.set-card:first-of-type{justify-content:flex-start}
.set-name{font-size:18px;font-weight:700;margin-bottom:4px}
.out-btn{display:inline-flex;align-items:center;gap:8px;background:#e5484d22;color:#ff8a8e;border-radius:12px;padding:12px 20px;font-weight:700}
.out-btn:hover{background:var(--red);color:#fff;transform:translateY(-2px)}

.gear{width:40px;height:40px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--mut)}
.gear .ic{width:18px;height:18px;transition:transform .6s var(--ease)}
.gear:hover,.gear.on{color:#fff;background:var(--line)}
.gear:hover .ic{transform:rotate(90deg)}
.menu{right:48px}
#right.swap>*:nth-child(6){animation-delay:.35s}

@property --r{syntax:'<number>';inherits:true;initial-value:74}
@property --g{syntax:'<number>';inherits:true;initial-value:108}
@property --b{syntax:'<number>';inherits:true;initial-value:247}
@property --ar{syntax:'<number>';inherits:true;initial-value:155}
@property --ag{syntax:'<number>';inherits:true;initial-value:92}
@property --ab{syntax:'<number>';inherits:true;initial-value:246}
@property --on-acc{syntax:'<color>';inherits:true;initial-value:#fff}
:root{transition:--r .7s var(--ease),--g .7s var(--ease),--b .7s var(--ease),--ar .7s var(--ease),--ag .7s var(--ease),--ab .7s var(--ease),--on-acc .7s var(--ease)}
html.rgb-live{transition:none}
html[data-theme=red]{--r:229;--g:72;--b:77;--ar:255;--ag:138;--ab:61}
html[data-theme=yellow]{--r:245;--g:197;--b:24;--ar:255;--ag:159;--ab:28;--on-acc:#1a1400}
html[data-theme=green]{--r:34;--g:197;--b:94;--ar:20;--ag:184;--ab:166;--on-acc:#04170a}
.steam,.join,.plan.p .buy,.periods button.on,.prem,.promo-pop>button,.admin-tools button.ok,.plus:hover{color:var(--on-acc)}
.set-card.col{flex-direction:column;align-items:flex-start}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme-btn{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--panel2);font-weight:600;border:1px solid transparent}
.theme-btn i{width:18px;height:18px;border-radius:50%;display:block}
.theme-btn:hover{background:var(--line)}
.theme-btn.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-btn[data-t=rgb] i{animation:spin 4s linear infinite}

.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:28px;color:var(--mut);font-size:13px}
.scroll-hint span{font-size:20px;animation:hint 1.6s var(--ease) infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(7px);opacity:1}}
@keyframes bob{from{transform:translateY(-6px) rotate(-1.2deg)}to{transform:translateY(8px) rotate(1.2deg)}}
.reveal-zone{--e:0;--q:0;height:240vh;position:relative;margin-top:30px}
.reveal-stage{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden}
.burst{position:absolute;inset:-35%;pointer-events:none;
 background:repeating-conic-gradient(from 0deg,rgba(var(--acc-rgb),.2) 0 9deg,transparent 9deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);
 opacity:var(--e);transform:rotate(calc(var(--q)*80deg)) scale(calc(.55 + var(--e)*.55))}
.reveal-bob{position:relative;animation:bob 1.4s ease-in-out infinite alternate}
.reveal-img{display:block;width:min(88vw,640px);height:auto;border-radius:24px;
 box-shadow:0 30px 90px rgba(var(--acc-rgb),.4),0 0 0 1px var(--line);
 opacity:clamp(0,calc(var(--e)*1.7 - .35),1);
 transform:translateY(calc((1 - var(--e))*160px)) scale(calc(.6 + var(--e)*.4)) rotate(calc((var(--q) - .5)*10deg))}
@media(prefers-reduced-motion:reduce){.reveal-bob{animation:none}.scroll-hint span{animation:none}}
</style>
<style>
.pf-back{display:inline-flex;gap:6px;align-items:center;background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:10px}.pf-back:hover{color:var(--tx)}
.pf-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.pf-ava{width:84px;height:84px;border-radius:16px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;display:grid;place-items:center;font-size:34px;font-weight:800}
.pf-main{flex:1;min-width:200px}
.pf-name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:28px;font-weight:800;line-height:1.15;word-break:break-word}
.pf-bdg{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;letter-spacing:.2px}
.pf-bdg.ban{background:var(--red);color:#fff}
.pf-bdg.vip{background:linear-gradient(135deg,var(--acc),var(--acc-b));color:var(--on-acc)}
.pf-steam{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--panel2);color:var(--tx);font-size:12px;font-weight:700;text-decoration:none}
.pf-sub{color:var(--mut);font-size:14px;margin-top:6px}
.pf-banbox{background:color-mix(in srgb,var(--red) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.pf-rank{background:var(--panel2);border-radius:12px;padding:12px 18px;text-align:center}.pf-rank b{display:block;font-size:20px}.pf-rank span{color:var(--mut);font-size:13px}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pf-tile{background:var(--panel);border-radius:14px;padding:14px 16px}.pf-tile span{display:block;color:var(--mut);font-size:13px}.pf-tile b{display:block;font-size:22px;margin-top:10px}.pf-tile small{color:var(--mut);font-size:12px}
.pf-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:26px 0 8px}
.pf-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:inherit;font-weight:700;padding:12px 16px;margin-bottom:-1px}
.pf-tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.pf-acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lb-who{cursor:pointer}.lb-who:hover .nm{text-decoration:underline}
</style>
</head>

<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const prev={menu:false,promo:false,logged:false,coins:null,key:''};
function countTo(from,to){
  const t0=performance.now(),d=800;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3),el=$('#bal');
    if(el)el.textContent=(from+(to-from)*e).toFixed(2);
    if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function setPeriod(k,i,btn){
  st.plan[k]=i;
  const plan=btn.closest('.plan');
  plan.querySelectorAll('.periods button').forEach((b,j)=>b.classList.toggle('on',j===i));
  const p=plan.querySelector('.price');
  p.textContent=price[k][i]+' ₽';
  p.classList.remove('tick');void p.offsetWidth;p.classList.add('tick');
}
const st={page:'home',lb:'exp',bt:'bans',plan:{prem:0,plus:0},rule:0,user:null,menu:false,promoOpen:false,promo:'',promoMsg:null};

// Промокоды: временный список для примера, лучше хранить и проверять на сервере,
// иначе любой посмотрит код прямо в исходнике страницы.
const PROMO_CODES={
  'START100':{coins:100,text:'+100 монет'},
  'WELCOME50':{coins:50,text:'+50 монет'},
  'MELLSTROYPROJECT':{coins:200,text:'+200 монет'}
};
const usedPromoKey='usedPromoCodes';
function getUsedPromo(){try{return JSON.parse(localStorage.getItem(usedPromoKey)||'[]')}catch(e){return []}}
function togglePromo(){st.promoOpen=!st.promoOpen;st.menu=false;st.promoMsg=null;draw()}
function buyPlan(key,name){
  if(!st.user){alert('Сначала войдите через Steam, чтобы купить');return}
  const cost=price[key][st.plan[key]];
  const bal=st.user.coins||0;
  if(bal<cost){alert(`Недостаточно средств: не хватает ${(cost-bal).toFixed(2)} ₽. Пополните баланс или используйте промокод.`);return}
  st.user.coins=bal-cost;
  if(key==='plus'){
    const until=Math.max(Date.now(),getPlusUntil(st.user.id))+PERIOD_DAYS[st.plan[key]]*864e5;
    try{localStorage.setItem('plusUntil:'+st.user.id,String(until))}catch(e){}
    applyRole(st.user);
  }
  alert(`Покупка успешна: ${name} ${key==='plus'?'навсегда':'на '+periods[st.plan[key]]}`+(key==='plus'?'. Рядом с промокодом появилась кнопка «Админ-панель».':''));
  draw();
}
function activatePromo(){
  if(!st.user){st.promoMsg={ok:false,text:'Сначала войдите через Steam'};draw();return}
  const code=st.promo.trim().toUpperCase();
  const fail=t=>{st.promoMsg={ok:false,text:t};draw()};
  if(!code)return fail('Введите код');
  const found=allPromos()[code];
  if(!found)return fail('Код не найден');
  const usedKey='usedPromoCodes:'+st.user.id,used=LS.get(usedKey,[]);
  if(used.includes(code))return fail('Этот код уже был использован');
  if(found.max>0&&(found.used||0)>=found.max)return fail('Лимит активаций этого кода исчерпан');
  st.user.coins=(st.user.coins||0)+found.coins;
  used.push(code);LS.set(usedKey,used);
  if(!found.builtin){const list=getCustomPromos(),p=list.find(x=>x.code===code);if(p){p.used=(p.used||0)+1;LS.set('customPromos',list)}}
  st.promo='';

// Аватарка и ник из Steam. OpenID отдаёт только SteamID, поэтому профиль берём отдельно:
// 1) со своего backend (/api/steam-profile) — лучший вариант, когда сайт лежит на хостинге;
// 2) иначе — публичная XML-страница профиля Steam через CORS-прокси (работает и из локального файла).
const avatarTried={};
async function getWithTimeout(url,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return r}finally{clearTimeout(t)}
}
function parseSteamXml(x){
  const g=tag=>{const m=x.match(new RegExp('<'+tag+'>\\s*(?:<!\\[CDATA\\[)?\\s*([\\s\\S]*?)\\s*(?:\\]\\]>)?\\s*</'+tag+'>'));return m?m[1]:null};
  return {avatar:g('avatarFull'),name:g('steamID')};
}
async function loadSteamAvatar(){
  const u=st.user;
  if(!u||u.avatar||!/^\d{17}$/.test(u.id)||avatarTried[u.id])return;
  avatarTried[u.id]=true;
  let info=null;
  try{
    if(location.protocol.startsWith('http')){info=await (await getWithTimeout('/api/steam-profile?steamid='+u.id,4000)).json()}
  }catch(e){}
  if(!info||!safeAvatar(info.avatar)){
    const xml='https://steamcommunity.com/profiles/'+u.id+'?xml=1';
    const proxies=[x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),x=>'https://corsproxy.io/?'+encodeURIComponent(x)];
    for(const p of proxies){
      try{
        const r=parseSteamXml(await (await getWithTimeout(p(xml),8000)).text());
        if(safeAvatar(r.avatar&&r.avatar.replace(/^http:/,'https:'))){info={avatar:r.avatar.replace(/^http:/,'https:'),name:r.name};break}
      }catch(e){}
    }
  }
  const av=info&&safeAvatar(info.avatar);
  if(av&&st.user&&st.user.id===u.id){
    st.user.avatar=av;
    if(info.name&&typeof info.name==='string')st.user.name=info.name.slice(0,32);
    draw();
  }else avatarTried[u.id]=false; // не вышло — попробуем при следующем входе/загрузке
}

function adminMsgNow(id,text){const e=$(id);if(e){e.textContent=text;e.className='promo-msg err'}}
function adminOk(kind,text){st.adminMsg={[kind]:{ok:true,text}};draw()}
function grantAdmin(){
  if(!(st.user&&st.user.canManage))return;
  const id=($('#grantId').value||'').trim(),sel=$('#grantDays').value;
  if(!/^\d{17}$/.test(id))return adminMsgNow('#grantMsg','SteamID64 — это 17 цифр (например 76561198…)');
  if(id===OWNER_STEAM_ID)return adminMsgNow('#grantMsg','Этот игрок уже владелец');
  const g=getGrants(),cur=g[id]?+g[id].until:0,base=Math.max(Date.now(),cur<FOREVER?cur:0);
  g[id]={until:sel==='0'?FOREVER:base+(+sel)*864e5,by:st.user.id,at:Date.now()};
  LS.set('adminGrants',g);
  if(st.user.id===id)applyRole(st.user);
  adminOk('grant','Админка выдана: '+id+' — '+(sel==='0'?'навсегда':sel+' дн.'));
}
function revokeAdmin(id){
  if(!(st.user&&st.user.canManage)||!/^\d{17}$/.test(id))return;
  const g=getGrants();delete g[id];LS.set('adminGrants',g);
  if(st.user.id===id)applyRole(st.user);
  adminOk('grant','Админка снята: '+id);
}
function addDeputy(){
  if(!(st.user&&st.user.isOwner))return;
  const id=($('#depId').value||'').trim();
  if(!/^\d{17}$/.test(id))return adminMsgNow('#depMsg','SteamID64 — это 17 цифр (например 76561198…)');
  if(id===OWNER_STEAM_ID)return adminMsgNow('#depMsg','Это вы — владелец');
  const d=getDeputies();
  if(d[id])return adminMsgNow('#depMsg','Этот игрок уже зам');
  d[id]={at:Date.now(),by:st.user.id};LS.set('deputies',d);
  adminOk('deputy','Зам назначен: '+id);
}
function removeDeputy(id){
  if(!(st.user&&st.user.isOwner)||!/^\d{17}$/.test(id))return;
  const d=getDeputies();delete d[id];LS.set('deputies',d);
  adminOk('deputy','Зам снят: '+id);
}
function genPromo(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';
  for(let i=0;i<8;i++)c+=a[Math.floor(Math.random()*a.length)];
  $('#pCode').value='PROMO-'+c;
}
function createPromo(){
  if(!(st.user&&st.user.isOwner))return;
  const code=($('#pCode').value||'').trim().toUpperCase(),coins=+$('#pCoins').value,max=Math.floor(+$('#pMax').value||0);
  if(!/^[A-Z0-9_-]{3,24}$/.test(code))return adminMsgNow('#promoMsgA','Код: 3–24 символа — латиница, цифры, _ или -');
  if(!(coins>0&&coins<=100000))return adminMsgNow('#promoMsgA','Награда: число от 1 до 100 000');
  if(max<0||max>1000000)return adminMsgNow('#promoMsgA','Лимит активаций: от 0 (без лимита) до 1 000 000');
  if(allPromos()[code])return adminMsgNow('#promoMsgA','Такой код уже существует');
  const list=getCustomPromos();
  list.push({code,coins,max,used:0,by:st.user.id,at:Date.now()});LS.set('customPromos',list);
  adminOk('promo','Промокод создан: '+code+' (+'+coins+' монет)');
}
function deletePromo(code){
  if(!(st.user&&st.user.isOwner)||!/^[A-Z0-9_-]{3,24}$/.test(code))return;
  LS.set('customPromos',getCustomPromos().filter(p=>p.code!==code));
  adminOk('promo','Промокод удалён: '+code);
}

let scrollTick=false;
function updateReveal(){
  scrollTick=false;
  const z=document.querySelector('.reveal-zone');
  if(!z)return;
  const r=z.getBoundingClientRect(),vh=window.innerHeight||800;
  const e=reduce?1:Math.min(1,Math.max(0,(vh-r.top)/(vh*.9)));              // появление
  const q=reduce?.5:Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-vh))); // прогресс, пока картинка закреплена
  z.style.setProperty('--e',e.toFixed(3));z.style.setProperty('--q',q.toFixed(3));
}
window.addEventListener('scroll',()=>{if(!scrollTick){scrollTick=true;requestAnimationFrame(updateReveal)}},{passive:true});
window.addEventListener('resize',updateReveal);
function draw(){
  saveUser();
  head();
  const app=$('#app'),html=view(),key=st.page+'|'+st.lb+'|'+st.bt+'|'+st.rule,changed=key!==prev.key;
  prev.key=key;
  app.classList.toggle('enter',changed);
  app.innerHTML=html;
  if(changed)app.querySelectorAll('tr,.plan,.mode,.admin-card,.admin-tools,.bar,.side,.empty,.stat,.set-card').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)));
  urlSync();

async function api(p,b){
  const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Ошибка');
  return j;
}
let SV={grants:{},deputies:{},promos:[]};
function getGrants(){return SV.grants}
function getDeputies(){return SV.deputies}
function getCustomPromos(){return SV.promos}
function allPromos(){const m={};for(const p of SV.promos)m[p.code]=p;return m}
function applyRole(u){
  u.avatar=safeAvatar(u.avatar);
  u.isOwner=u.id===OWNER_STEAM_ID;
  u.plusUntil=Math.max(u.plus||0,u.grant||0);
  u.hasPlus=u.plusUntil>Date.now();
  u.isDeputy=!u.isOwner&&!!u.deputy;
  u.canManage=u.isOwner||u.isDeputy;
  u.full=u.isOwner||!!u.full; // владелец и назначенные замы
  u.perms=Array.isArray(u.perms)?u.perms:[];
  u.isAdmin=u.canManage||u.hasPlus||u.perms.length>0;
  u.role=u.isOwner?'Владелец':(u.isDeputy?'Зам':(u.hasPlus?'Админ+':(u.perms.length?'Модератор':null)));
  return u;
}
async function loadMe(){
  try{const m=await api('me');if(m){SV=m.adm||SV;delete m.adm;st.user=applyRole(m)}else st.user=null}catch(e){}
  if(!AUTH_READY){AUTH_READY=true;if(WANT_PAGE==='admin'&&st.page==='home')st.page='admin'}
  draw();
}
function steamLogin(){location.href='/auth/steam'}
function demoLogin(){alert('Демо отключено — войдите через Steam')}
async function logout(){
  try{await fetch('/auth/logout',{method:'POST'})}catch(e){}
  st.user=null;st.menu=false;st.promoOpen=false;st.adminMsg={};
  if(st.page==='settings'||st.page==='admin')st.page='home';
  draw();
}
async function buyPlan(key,name){
  if(!st.user){alert('Сначала войдите через Steam, чтобы купить');return}
  try{
    await api('buy',{key,idx:st.plan[key]});await loadMe();
    alert(`Покупка успешна: ${name} ${key==='plus'?'навсегда':'на '+periods[st.plan[key]]}`+(key==='plus'?'. Рядом с промокодом появилась кнопка «Админ-панель».':''));
  }catch(e){alert(e.message)}
}
async function activatePromo(){
  if(!st.user){st.promoMsg={ok:false,text:'Сначала войдите через Steam'};draw();return}
  const code=st.promo.trim().toUpperCase();
  if(!code){st.promoMsg={ok:false,text:'Введите код'};draw();return}
  try{const r=await api('promo',{code});st.promo='';st.promoMsg={ok:true,text:'Код активирован: +'+r.coins+' монет'}}
  catch(e){st.promoMsg={ok:false,text:e.message}}
  await loadMe();
}
const MID={vipgrant:'#vipMsg',grant:'#grantMsg',deputy:'#depMsg',promo:'#promoMsgA'};
async function adm(kind,path,body,ok){
  try{await api('admin/'+path,body);await loadMe();adminOk(kind,ok)}
  catch(e){adminMsgNow(MID[kind],e.message)}
}
function grantAdmin(){adm('grant','grant',{id:($('#grantId').value||'').trim(),name:($('#grantName')?.value||'').trim(),flags:($('#grantFlags')?.value||'').trim(),immunity:$('#grantImm')?.value||'',days:+$('#grantDays').value},'Админка выдана')}
function grantVip(){const f=$('#vipForever').checked,d=Math.floor(+$('#vipDays').value);if(!f&&!(d>=1))return adminMsgNow(MID.vipgrant,'Укажите срок в днях или отметьте «Навсегда»');adm('vipgrant','vip-grant',{id:($('#vipId').value||'').trim(),days:f?0:d},'VIP выдан')}
function revokeVip(id){if(!confirm('Снять VIP у '+id+'? Запись будет удалена из базы игры.'))return;adm('vipgrant','vip-revoke',{id},'VIP снят: '+id)}
function revokeAdmin(id){if(!confirm('Удалить админа '+id+'? Строка будет удалена из базы игры, а срок Админ+ на сайте обнулится.'))return;adm('grant','revoke',{id},'Админка снята: '+id)}
function addDeputy(){adm('deputy','deputy',{id:($('#depId').value||'').trim(),on:true},'Зам назначен')}
function removeDeputy(id){adm('deputy','deputy',{id,on:false},'Зам снят: '+id)}
function createPromo(){adm('promo','promo',{code:($('#pCode').value||'').trim().toUpperCase(),coins:+$('#pCoins').value,max:Math.floor(+$('#pMax').value||0)},'Промокод создан')}
function deletePromo(code){adm('promo','promo-delete',{code},'Промокод удалён: '+code)}
loadMe();
</script>
<script>
// ===== Баны и муты через сайт =====
async function loadBans(){
  try{
    for(const k of ['bans','mutes']){
      const rows=await api('bans?type='+k),arr=k==='bans'?bans:mutes;
      arr.length=0;
      rows.forEach(r=>arr.push([r.player,r.admin,r.reason,r.active?1:0,r.term,new Date(r.at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})]));
    }
  }catch(e){}
  draw();
}
async function adminAction(verb){
  const t=($('#adminTarget')?.value||'').trim();
  if(!t){alert('Укажите SteamID64 игрока (17 цифр)');return}
  if(verb==='Разбанен'||verb==='Размьючен'){
    if(!/^\d{17}$/.test(t)){alert('Для разбана укажите SteamID64 игрока (17 цифр)');return}
    const why=prompt('Причина разбана:','Разбан с сайта');if(why===null)return;
    const isBan=verb==='Разбанен';
    try{
      const r=await api('admin/unban',{target:t,kind:isBan?'bans':'mutes',reason:why});
      await loadBans();
      alert(r.count?((isBan?'Разбанен: ':'Мут снят: ')+t):('У этого игрока нет активных '+(isBan?'банов':'мутов')));
    }catch(e){alert(e.message)}
    return;
  }
  if(verb!=='Забанен'&&verb!=='Замьючен'){alert('Это действие выполняется прямо в игре — нужен плагин на игровом сервере.');return}
  const reason=prompt('Причина:');if(reason===null)return;
  const d=prompt('На сколько дней? (0 = навсегда)','7');if(d===null)return;
  try{
    await api('admin/punish',{target:t,kind:verb==='Забанен'?'bans':'mutes',reason,days:+d||0});
    await loadBans();
    alert((verb==='Забанен'?'Бан':'Мут')+' записан: '+t);
  }catch(e){alert(e.message)}
}
loadBans();
</script>
<script>
// ===== Лидеры из базы игрового сервера (LevelsRanks) =====
function lbWho(r){ // аватарка + ник (+ ссылка на профиль Steam, если известен SteamID)
  const a=safeAvatar(r[5]),n=String(r[0]||'');
  const av=`<i class="pa" style="${a?`background-image:url('${a}')`:''}">${a?'':esc((n||'?').trim().charAt(0).toUpperCase())}</i>`;
  const ok=/^\d{17}$/.test(r[6]||''),nm=ok?`<a class="lnk nm" href="/profile/${r[6]}" onclick="openProfile('${r[6]}');return false">${esc(n)}</a>`:esc(n);
  return `<span class="ppl">${av}<span>${nm}</span>${r[7]?'<span class="prem">ПРЕМИУМ</span>':''}</span>`;
}
async function loadLeaders(){
  try{
    const rows=await api('leaders');
    if(rows.length){
      leaders.exp=rows.map(r=>[r.name,r.exp.toLocaleString('ru-RU'),r.kills.toLocaleString('ru-RU'),(r.deaths?r.kills/r.deaths:r.kills).toFixed(2),r.hours+' ч.',r.avatar,r.id,r.prem]);
      draw();
    }
  }catch(e){}
}
loadLeaders();

// ===== Профиль игрока =====
async function openProfile(id,noPush){
  if(!/^\d{17}$/.test(id||''))return;
  PF.id=id;PF.data=null;PF.err='';PF.busy=true;st.menu=false;st.promoOpen=false;st.page='profile';if(!noPush)NAV_PUSH=true;
  try{window.scrollTo(0,0)}catch(e){}
  draw();
  try{const d=await api('player/'+id);if(PF.id===id)PF.data=d}catch(e){PF.err=e.message}
  PF.busy=false;if(st.page==='profile')draw();
}
function pfAgo(ts){
  const m=Math.floor((Date.now()-ts)/6e4);
  if(m<5)return 'Был(-а) в игре только что';
  if(m<60)return 'Был(-а) в игре '+m+' мин. назад';
  const h=Math.floor(m/60);if(h<24)return 'Был(-а) в игре '+h+' ч. назад';
  const d=Math.floor(h/24);return 'Был(-а) в игре '+d+' дн. назад';
}
function profileView(){
  const back=`<button class="pf-back" onclick="go('leaders')">← К лидерам</button>`;
  if(PF.err)return back+`<div class="empty">${esc(PF.err)}</div>`;
  const d=PF.data;if(!d)return back+`<div class="empty">Загружаем профиль…</div>`;
  const a=safeAvatar(d.avatar),n=String(d.name||d.id),S=d.stats;
  const fmt=v=>v===null||v===undefined?null:Number(v).toLocaleString('ru-RU');
  const kd=S&&S.kills!==null&&S.deaths!==null?(S.deaths?S.kills/S.deaths:S.kills).toFixed(2):null;
  const acc=S&&S.shoots?(S.hits/S.shoots*100).toFixed(1)+'%':null;
  const hs=S&&S.kills&&S.headshots!==null?(S.headshots/S.kills*100).toFixed(1)+'%':null;
  const top=S&&S.total?Math.max(0.1,S.place/S.total*100).toFixed(1):null;
  const tiles=S?[
    ['Место','#'+S.place.toLocaleString('ru-RU'),top?'Топ '+top+'%':''],['У/С',kd],['Убийств',fmt(S.kills)],['Смертей',fmt(S.deaths)],
    ['Убийств в голову',fmt(S.headshots)],['Выстрелов',fmt(S.shoots)],['Время игры',S.hours!==null?S.hours.toLocaleString('ru-RU')+' ч.':null],
    ['Попаданий',fmt(S.hits)],['Точность',acc],['% в голову',hs]
  ].filter(t=>t[1]!==null&&t[1]!==undefined):[];
  const mine=st.user&&st.user.id===d.id;
  return back+`<div class="pf-head">
    <div class="pf-ava" style="${a?`background-image:url('${a}')`:''}">${a?'':esc(n.trim().charAt(0).toUpperCase())}</div>
    <div class="pf-main"><div class="pf-name">${esc(n)}
      ${d.banned?'<span class="pf-bdg ban">Заблокирован</span>':''}${d.vip?'<span class="pf-bdg vip">Премиум</span>':''}
      <a class="pf-steam" href="https://steamcommunity.com/profiles/${d.id}" target="_blank" rel="noopener" title="Профиль в Steam">S</a></div>
      <div class="pf-sub">${d.lastSeen?pfAgo(d.lastSeen):(S?'':'Игрок ещё не заходил на сервер')}</div></div>
    ${S&&S.rank!==null?`<div class="pf-rank"><b>${fmt(S.exp)}</b><span>опыта · звание ${S.rank}</span></div>`:''}
  </div>
  ${d.banned?`<div class="pf-banbox"><b>Игрок заблокирован</b> · срок: ${esc(d.banned.term)}${d.banned.reason?' · причина: '+esc(d.banned.reason):''}</div>`:''}
  ${mine?`<div class="pf-acts"><button class="join" onclick="go('settings')">Настройки</button><button class="join del" onclick="logout()">Выйти из аккаунта</button></div>`:''}
  ${tiles.length?`<div class="pf-grid">${tiles.map(t=>`<div class="pf-tile"><span>${t[0]}</span><b>${t[1]}</b>${t[2]?`<small>${t[2]}</small>`:''}</div>`).join('')}</div>`:'<div class="empty">Статистики пока нет — игрок не появлялся в таблице лидеров.</div>'}
  ${mine&&typeof skinsView==='function'?`<div class="pf-tabs"><button class="on">Скинченджер</button></div>${skinsView().replace('<h1>Скины</h1>','')}`:''}`;
}
{const _v=view;view=function(){return st.page==='profile'?profileView():_v()}}
if(WANT_PROFILE){const id=WANT_PROFILE;WANT_PROFILE=null;openProfile(id,true)} // открыли ссылку вида /profile/<SteamID64>
</script>

<script>
// ===== Скин-ченджер: страница «Скины» =====
const SKN={data:null,mine:{skins:{},knife:null},cat:'Винтовки',w:'weapon_ak47',wear:0.01,seed:0,msg:'',busy:false,q:''};
const skEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
{const n=document.getElementById('nav');if(n){n.innerHTML='';head()}}
const _view=view;
view=function(){return st.page==='skins'?skinsView():_view()};
async function skLoad(){
  if(SKN.busy)return;SKN.busy=true;
  try{SKN.data=await api('skins')}catch(e){SKN.msg=e.message}
  if(SKN.data&&st.user){try{SKN.mine=await api('myskins')}catch(e){SKN.msg=e.message}}
  SKN.busy=false;draw();
}
function skinsView(){
  if(!st.user)return '<h1>Скины</h1><div class="empty">Войдите через Steam, чтобы выбрать скины для оружия.</div>';
  if(!SKN.data){
    if(!SKN.busy&&!SKN.msg)skLoad();
    return '<h1>Скины</h1><div class="empty">'+(SKN.msg?skEsc(SKN.msg)+'<br><br><button class="join" onclick="SKN.msg=\'\';draw()">Повторить</button>':'Загружаем скины…')+'</div>';
  }

<script>
// ===== Уведомления (заменяют системные alert) =====
(function(){
  let box;
  const ICON={ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',err:'<path d="M6 6l12 12M18 6L6 18"/>',info:'<path d="M12 7.5h.01M11 11.5h1.2v5.5"/>'};
  const ERR=/^(не |нельзя|ошибк|недостаточно|неверн|нет |укажите|введите|сначала|такого|такой|лимит|этот код|войдите|вашего|для разбана)|не удалось|не найден|не настроен|исчерпан/i;
  const OK=/успешн|применён|сохранён|активирован|выдана|снята|записан|разбанен|создан|удалён|назначен|скопировано|мут снят/i;
  window.toast=function(msg,type){
    msg=String(msg==null?'':msg);type=type||(ERR.test(msg)?'err':OK.test(msg)?'ok':'info');
    if(!box){box=document.createElement('div');box.className='toasts';document.body.appendChild(box)}
    const t=document.createElement('div'),ms=Math.min(9000,3500+msg.length*45);
    t.className='toast '+type;t.style.setProperty('--td',ms+'ms');
    t.innerHTML='<div class="ti"><svg viewBox="0 0 24 24">'+ICON[type]+'</svg></div><div>'+esc(msg)+'</div><i class="tb"></i>';
    const close=()=>{if(t.classList.contains('out'))return;t.classList.add('out');setTimeout(()=>t.remove(),350)};
    let timer=setTimeout(close,ms);
    t.onclick=close;t.onmouseenter=()=>clearTimeout(timer);t.onmouseleave=()=>{timer=setTimeout(close,1500)};
    box.appendChild(t);while(box.children.length>4)box.firstChild.remove();
  };
  window.alert=m=>window.toast(m);
  window.ask=function(title,fields,okText){return new Promise(res=>{
    const o=document.createElement('div');o.className='ask-back';
    o.innerHTML='<div class="ask-box"><h3>'+esc(title)+'</h3>'+fields.map((f,i)=>'<label>'+esc(f.label)+(f.options
      ?'<select data-i="'+i+'">'+f.options.map(([v,t])=>'<option value="'+v+'"'+(v==f.value?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'
      :'<input data-i="'+i+'" type="text" value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'">')+'</label>').join('')
      +'<div class="ask-row"><button class="ask-no">Отмена</button><button class="ask-ok">'+esc(okText||'Подтвердить')+'</button></div></div>';
    document.body.appendChild(o);
    const els=[...o.querySelectorAll('[data-i]')],done=v=>{o.classList.add('out');setTimeout(()=>o.remove(),250);res(v)};
    o.querySelector('.ask-ok').onclick=()=>done(els.map(e=>e.value));
    o.querySelector('.ask-no').onclick=()=>done(null);
    o.onclick=e=>{if(e.target===o)done(null)};
    o.onkeydown=e=>{if(e.key==='Enter')o.querySelector('.ask-ok').click();if(e.key==='Escape')done(null)};
    if(els[0])els[0].focus();
  })};
})();

/* ===== Дополнительные анимации: уход страницы, волна на кнопках, пульс выбранного, кольцо на успехе ===== */
#app{transition:opacity .15s ease,transform .15s ease,filter .15s ease}
#app.leave{opacity:0;transform:translateY(-10px) scale(.99);filter:blur(5px)}
.toast .ti{position:relative}
.toast.ok .ti::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgb(var(--tc));animation:tring .9s .2s ease-out both}
@keyframes tring{from{transform:scale(.7);opacity:.9}to{transform:scale(2.4);opacity:0}}
.sk-card.cur,.ag-card.on{animation:curpulse 2.4s ease-in-out infinite}
@keyframes curpulse{50%{box-shadow:0 0 0 2px rgba(var(--acc-rgb),.6),0 0 30px rgba(var(--acc-rgb),.6)}}
.rip{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){#app.leave{opacity:1;transform:none;filter:none}.sk-card.cur,.ag-card.on{animation:none}}
</style>
<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // плавный уход страницы перед показом новой
  const _go=go;
  window.go=function(p){
    const a=document.getElementById('app');
    if(reduce||!a||p===st.page){_go(p);return}
    a.classList.add('leave');
    setTimeout(()=>{a.classList.remove('leave');_go(p)},150);
  };
  // волна при нажатии на кнопки
  document.addEventListener('pointerdown',e=>{
    if(reduce||!e.target.closest)return;
    const b=e.target.closest('.join,.steam,.promo-btn,nav button,.plan .buy,.ask-row button,.sk-ws button,.tabs button,.ag-tabs button,.promo-pop>button,.admin-tools button');
    if(!b)return;b.classList.add('rip');
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,x=document.createElement('span');
    x.className='ripple';x.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
    b.appendChild(x);setTimeout(()=>x.remove(),650);
  });
})();
</script>
<style>
.ppl{display:flex;align-items:center;gap:10px}
.pa{width:32px;height:32px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc-b)) center/cover no-repeat;display:grid;place-items:center;font-size:14px;font-weight:800;font-style:normal;color:#fff}
.perm-grid{display:flex;flex-wrap:wrap;gap:10px 22px;width:100%}
.perm{display:flex;align-items:center;gap:8px;cursor:pointer}
.perm input,.admin-tools .perm input{flex:none;min-width:0;width:18px;height:18px;padding:0;margin:0;accent-color:var(--acc)}
</style>
<script>
// ===== Права доступа и дизайн сайта =====
function can(p){return !!(st.user&&(st.user.isOwner||(st.user.perms||[]).includes(p)))}
const PERM_LABELS={ban:'Банить и мутить',unban:'Разбанивать и снимать мут',grant:'Выдавать и снимать Админ+',promo:'Промокоды',server:'Серверы',design:'Дизайн сайта'};
MID.perms='#permMsg';MID.design='#designMsg';MID.gaedit='#gaeMsg';
function editAdmin(id){
  const a=(SV.admins||[]).find(x=>x.id===id);if(!a)return;
  $('#gaeId').value=a.id;$('#gaeName').value=a.name||'';$('#gaeFlags').value=a.flags||'';$('#gaeImm').value=a.imm;
  $('#gaeDays').value='keep';$('#gaeOff').checked=!!a.off;
  $('#gaeId').scrollIntoView({block:'center',behavior:'smooth'});$('#gaeName').focus();
}
function saveAdminEdit(){
  const id=($('#gaeId').value||'').trim();
  if(!/^\d{17}$/.test(id))return adminMsgNow('#gaeMsg','Сначала нажмите «Изменить» у админа в таблице');
  adm('gaedit','admin-edit',{id,name:($('#gaeName').value||'').trim(),flags:($('#gaeFlags').value||'').trim(),immunity:$('#gaeImm').value,days:$('#gaeDays').value,off:$('#gaeOff').checked},'Админ изменён в базе: '+id);
}
function editPromo(code){
  const p=allPromos()[code];if(!p)return;
  const c=prompt('Награда в монетах для '+code+':',p.coins);if(c===null)return;
  const m=prompt('Лимит активаций (0 = без лимита):',p.max||0);if(m===null)return;
  adm('promo','promo-edit',{code,coins:+c,max:Math.floor(+m||0)},'Промокод изменён: '+code);
}
function permsAdmin(){
  const m=(st.adminMsg||{}).perms,list=Object.entries(SV.perms||{});
  return `<h2 class="sec">Права доступа</h2>
   <div class="admin-tools"><input id="permId" placeholder="SteamID64 игрока (17 цифр)" inputmode="numeric" maxlength="17" aria-label="SteamID64">
     <div class="perm-grid">${Object.entries(PERM_LABELS).map(([k,t])=>`<label class="perm"><input type="checkbox" data-perm="${k}">${t}</label>`).join('')}</div>
     <button class="ok" onclick="savePerms()">Сохранить права</button><div id="permMsg" class="promo-msg ${m?(m.ok?'ok':'err'):''}">${m?esc(m.text):''}</div></div>
   <p class="stat" style="margin-bottom:10px">Права выдаются поверх роли: заместитель уже умеет банить, разбанивать и выдавать «Админ+». Чтобы банить с сайта, игрок должен быть в списке админов игры. Назначение замов и выдача прав — только у владельца.</p>
   ${list.length?`<table><tr><th>Игрок</th><th>Права</th><th></th></tr>${list.map(([id,p])=>`<tr><td>${ppl(id,p.name,p.avatar)}</td><td>${esc(p.perms.map(k=>PERM_LABELS[k]||k).join(', '))}</td><td><button class="join" onclick="editPerms('${id}')">Изменить</button> <button class="join del" onclick="clearPerms('${id}')">Снять все</button></td></tr>`).join('')}</table>`:'<div class="empty">Отдельные права пока никому не выданы.</div>'}`;
}
function editPerms(id){
  const p=(SV.perms||{})[id],el=$('#permId');
  if(el){el.value=id;el.scrollIntoView({block:'center',behavior:'smooth'})}
  document.querySelectorAll('[data-perm]').forEach(c=>c.checked=!!(p&&p.perms.includes(c.dataset.perm)));
}
function savePerms(){
  const id=($('#permId').value||'').trim(),perms=[...document.querySelectorAll('[data-perm]')].filter(c=>c.checked).map(c=>c.dataset.perm);
  adm('perms','perms',{id,perms},perms.length?'Права сохранены: '+id:'Права сняты: '+id);
}
function clearPerms(id){if(!confirm('Снять все права у '+id+'?'))return;adm('perms','perms',{id,perms:[]},'Права сняты: '+id)}

let SITE={theme:'blue'};
async function loadSite(){
  try{SITE=await api('site')}catch(e){}
  if(!personalTheme())applyTheme(SITE.theme||'blue',false);
  draw();
}
function designAdmin(){
  const m=(st.adminMsg||{}).design,cur=SITE.theme||'blue',mine=personalTheme();
  return `<h2 class="sec">Дизайн сайта</h2>
   <div class="admin-tools"><div class="themes">${Object.entries(THEMES).map(([k,[n,g]])=>`<button class="theme-btn${k===cur?' on':''}" onclick="setSiteTheme('${k}')"><i style="background:${g}"></i>${n}</button>`).join('')}</div>
     <div id="designMsg" class="promo-msg ${m?(m.ok?'ok':'err'):''}">${m?esc(m.text):''}</div></div>
   <p class="stat" style="margin-bottom:10px">Тема по умолчанию для всех посетителей. Игроки, выбравшие тему в настройках, остаются со своей.${mine?` <a class="lnk" href="#" onclick="resetMyTheme();return false">У вас в этом браузере выбрана личная тема — сбросить, чтобы видеть тему сайта</a>`:''}</p>`;
}
async function setSiteTheme(k){
  try{await api('admin/design',{theme:k});SITE.theme=k;if(!personalTheme())applyTheme(k,false);adminOk('design','Тема сайта: '+THEMES[k][0])}
  catch(e){adminMsgNow('#designMsg',e.message)}
}
function resetMyTheme(){LS.set('themePick',0);LS.set('theme','blue');applyTheme(SITE.theme||'blue',false);draw()}
loadSite();
</script>
</body>
